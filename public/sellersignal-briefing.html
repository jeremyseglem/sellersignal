let allProspects = [];

// Direct bounds-based briefing (from map viewport or URL params)
async function startBriefingFromBounds(south, west, north, east, label) {
    document.getElementById('farmSetup').style.display = 'none';
    document.getElementById('dashboard').classList.add('active');
    document.getElementById('farmInput').value = label || 'Map Area';
    
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const now = new Date();
    document.getElementById('briefDate').textContent = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
    document.getElementById('briefFarm').textContent = label || 'Current Map Area';
    document.getElementById('briefStats').innerHTML = '<div class="loading-state" style="padding:0"><div class="loading-spinner" style="width:20px;height:20px;margin:0"></div></div>';
    
    const centerLat = (south + north) / 2;
    const centerLng = (west + east) / 2;
    let source = null;
    for (const [k,s] of Object.entries(SOURCES)) {
        const b = s.bounds;
        if (centerLat >= b.south && centerLat <= b.north && centerLng >= b.west && centerLng <= b.east) { source = s; break; }
    }
    if (!source) {
        document.getElementById('briefingContent').innerHTML = '<div class="empty-state">This area isn\'t covered yet.</div>';
        return;
    }
    
    try {
        document.getElementById('loadingSub').textContent = `Loading parcels for ${label || 'map area'}...`;
        const sw = latlngToMerc(south, west);
        const ne = latlngToMerc(north, east);
        const params = new URLSearchParams({
            geometry: `${sw.x},${sw.y},${ne.x},${ne.y}`,
            geometryType: 'esriGeometryEnvelope', inSR: '3857', spatialRel: 'esriSpatialRelIntersects',
            outFields: source.fields, returnGeometry: 'true', returnCentroid: 'true', outSR: '4326',
            f: 'json', resultRecordCount: String(source.max)
        });
        const res = await fetch(`${source.url}?${params}`);
        const data = await res.json();
        const allFeatures = data.features || [];
        
        if (!allFeatures.length) {
            document.getElementById('briefingContent').innerHTML = '<div class="empty-state">No properties found in this area.</div>';
            return;
        }
        
        const seen = new Set();
        const uniqueFeatures = allFeatures.filter(f => {
            const parsed = source.parse(f);
            const key = parsed.id || `${parsed.lat}-${parsed.lng}`;
            if (seen.has(key)) return false; seen.add(key); return true;
        });
        
        document.getElementById('briefFarm').textContent = `${label || 'Map Area'} · ${uniqueFeatures.length.toLocaleString()} parcels`;
        
        const parcels = uniqueFeatures.map(f => source.parse(f)).filter(p => p.lat !== 0 && !p.exempt && (p.ownerName || p.address));
        
        // Tenure enrichment (shared logic)
        await enrichTenure(source, parcels);
        
        document.getElementById('loadingSub').textContent = `Scoring ${parcels.length.toLocaleString()} properties...`;
        const stats = precomputeStats(parcels);
        const scored = parcels.map(p => {
            const result = scoreParcel(p, stats);
            return { ...p, ...result, signals: [...result.signals] };
        });
        
        allProspects = scored.filter(p => p.briefingRank >= 25 && p.scoreClass !== 'low' && p.address && p.address.length > 3).sort((a,b) => b.briefingRank - a.briefingRank);
        renderBriefing(allProspects, parcels.length, 0, 0);
        
    } catch(e) {
        console.error(e);
        document.getElementById('briefingContent').innerHTML = '<div class="empty-state">Error loading data. Please try again.</div>';
    }
}

async function startBriefing() {
    const query = document.getElementById('farmInput').value.trim();
    if (!query) return;
    
    document.getElementById('farmSetup').style.display = 'none';
    document.getElementById('dashboard').classList.add('active');
    
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const now = new Date();
    document.getElementById('briefDate').textContent = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
    document.getElementById('briefFarm').textContent = query;
    document.getElementById('briefStats').innerHTML = '<div class="loading-state" style="padding:0"><div class="loading-spinner" style="width:20px;height:20px;margin:0"></div></div>';
    
    const isZip = /^\d{5}$/.test(query);
    let source = null;
    let loc = null;
    
    if (isZip) {
        // ========================================
        // ZIP MODE — skip geocoding, find source by trying each one
        // ========================================
        document.getElementById('loadingSub').textContent = `Looking up ZIP ${query}...`;
        
        // Determine source: try King County first (ZIP5 field is exact), then Montana
        for (const [k,s] of Object.entries(SOURCES)) {
            if (!s.zipWhere) continue;
            // Quick probe: does this ZIP exist in this source?
            try {
                const probeParams = new URLSearchParams({
                    where: s.zipWhere(query), outFields: 'OBJECTID', returnGeometry: 'false',
                    f: 'json', resultRecordCount: '1'
                });
                const probeRes = await fetch(`${s.url}?${probeParams}`);
                const probeData = await probeRes.json();
                if (probeData.features?.length > 0) { source = s; break; }
            } catch(e) { continue; }
        }
        
        if (!source) {
            document.getElementById('briefingContent').innerHTML = '<div class="empty-state">ZIP code not found in covered areas. Currently available: Montana statewide, King County WA.</div>';
            return;
        }
    } else {
        // ========================================
        // ADDRESS / CITY MODE — geocode first
        // ========================================
        loc = await geocode(query);
        if (!loc) {
            document.getElementById('briefingContent').innerHTML = '<div class="empty-state">Could not find that location. Try a ZIP code (e.g. 59718 or 98112).</div>';
            return;
        }
        
        for (const [k,s] of Object.entries(SOURCES)) {
            const b = s.bounds;
            if (loc.lat >= b.south && loc.lat <= b.north && loc.lng >= b.west && loc.lng <= b.east) { source = s; break; }
        }
        
        if (!source) {
            document.getElementById('briefingContent').innerHTML = '<div class="empty-state">This area isn\'t covered yet. Currently available: Montana statewide, King County WA.</div>';
            return;
        }
    }
    
    document.getElementById('loadingSub').textContent = `Pulling parcel data for ${query}...`;
    
    try {
        let allFeatures = [];
        
        if (isZip && source.zipWhere) {
            // ========================================
            // ZIP SEARCH — direct WHERE query with pagination
            // No geometry, no tiling. Every parcel in this ZIP.
            // ========================================
            const whereClause = source.zipWhere(query.trim());
            const pageSize = source.max;
            const maxPages = 12; // cap at ~24000 records — covers all typical ZIPs
            let offset = 0;
            let hasMore = true;
            let page = 0;
            
            while (hasMore && page < maxPages) {
                document.getElementById('loadingSub').textContent = `Loading ZIP ${query}... ${allFeatures.length.toLocaleString()} parcels`;
                const params = new URLSearchParams({
                    where: whereClause,
                    outFields: source.fields,
                    returnGeometry: 'true',
                    returnCentroid: 'true',
                    outSR: '4326',
                    f: 'json',
                    resultRecordCount: String(pageSize),
                    resultOffset: String(offset)
                });
                const res = await fetch(`${source.url}?${params}`);
                const data = await res.json();
                const features = data.features || [];
                allFeatures.push(...features);
                hasMore = data.exceededTransferLimit === true && features.length > 0;
                offset += pageSize;
                page++;
            }
            
            console.log(`ZIP ${query}: ${allFeatures.length} total parcels in ${page} pages`);
            document.getElementById('briefFarm').textContent = `ZIP ${query} · ${allFeatures.length.toLocaleString()} parcels`;
            
        } else {
            // ========================================
            // ADDRESS / NEIGHBORHOOD / CITY — geometry-based query
            // ========================================
            let searchOffset = 0.025; // ~2 miles default
            if (loc.bbox && (loc.class === 'place' || loc.type === 'city' || loc.type === 'town')) {
                searchOffset = 0.06; // bigger for cities
            }
            const sw = latlngToMerc(loc.lat - searchOffset, loc.lng - searchOffset);
            const ne = latlngToMerc(loc.lat + searchOffset, loc.lng + searchOffset);
            
            document.getElementById('loadingSub').textContent = `Loading parcels near ${query}...`;
            const params = new URLSearchParams({
                geometry: `${sw.x},${sw.y},${ne.x},${ne.y}`,
                geometryType: 'esriGeometryEnvelope',
                inSR: '3857',
                spatialRel: 'esriSpatialRelIntersects',
                outFields: source.fields,
                returnGeometry: 'true',
                returnCentroid: 'true',
                outSR: '4326',
                f: 'json',
                resultRecordCount: String(source.max)
            });
            const res = await fetch(`${source.url}?${params}`);
            const data = await res.json();
            allFeatures = data.features || [];
            
            document.getElementById('briefFarm').textContent = `${query} · ${allFeatures.length.toLocaleString()} parcels`;
        }
        
        if (!allFeatures.length) {
            document.getElementById('briefingContent').innerHTML = '<div class="empty-state">No properties found. Try a ZIP code (e.g. 59718 or 98112).</div>';
            return;
        }
        
        // Dedupe by parcel ID
        const seen = new Set();
        const uniqueFeatures = allFeatures.filter(f => {
            const parsed = source.parse(f);
            const key = parsed.id || `${parsed.lat}-${parsed.lng}`;
            if (seen.has(key)) return false;
            seen.add(key);
            return true;
        });
        
        console.log(`Total: ${allFeatures.length}, unique: ${uniqueFeatures.length}`);
        
        const parcels = uniqueFeatures.map(f => source.parse(f)).filter(p => p.lat !== 0 && !p.exempt && (p.ownerName || p.address));
        
        // Tenure enrichment (shared function)
        await enrichTenure(source, parcels);
        
        document.getElementById('loadingSub').textContent = `Scoring ${parcels.length.toLocaleString()} properties...`;
        const stats = precomputeStats(parcels);
        const scored = parcels.map(p => {
            const result = scoreParcel(p, stats);
            return { ...p, ...result, signals: [...result.signals] };
        });
        
        // ========================================
        // MARKET SIGNALS — fetch listing activity from search results
        // ========================================
        document.getElementById('loadingSub').textContent = 'Scanning listing activity from Zillow, Redfin, Realtor...';
        
        // Parse city/state for market signals
        let cityName = '', stateName = '';
        if (/^\d{5}$/.test(query.trim())) {
            // ZIP query — extract city from geocoder result or first parcel
            if (loc && loc.name) {
                const parts = loc.name.split(',').map(s => s.trim());
                cityName = parts[1] || parts[0] || query; // typically "ZIP, City, County, State"
                stateName = parts[3] || parts[2] || '';
            }
            if (!cityName && parcels.length > 0) {
                const csz = parcels[0].cityStateZip || '';
                const cszParts = csz.split(',').map(s => s.trim());
                cityName = cszParts[0] || '';
                stateName = cszParts[1] || '';
            }
        } else {
            const queryParts = query.split(',').map(s => s.trim());
            cityName = queryParts[0] || '';
            stateName = queryParts[1] || '';
        }
        
        let marketSignals = [];
        try {
            const msRes = await fetch(`https://sellersignal.co/api/market-signals?city=${encodeURIComponent(cityName)}&state=${encodeURIComponent(stateName)}`);
            if (msRes.ok) {
                const msData = await msRes.json();
                marketSignals = msData.signals || [];
                console.log(`Market signals: ${marketSignals.length} address-level signals from ${msData.searchCount} searches in ${msData.elapsed}s`);
            }
        } catch(e) { console.log('Market signals fetch failed (server may not have endpoint yet):', e.message); }
        
        // Cross-reference market signals against loaded parcels
        let marketMatches = 0;
        if (marketSignals.length > 0) {
            for (const prospect of scored) {
                const pAddr = (prospect.address || '').toUpperCase().replace(/\s+/g, ' ').trim();
                if (!pAddr || pAddr.length < 5) continue;
                
                for (const sig of marketSignals) {
                    // Strict address match — require matching house number + street start
                    const sigAddr = sig.address || '';
                    const pNum = pAddr.match(/^(\d+)\s/)?.[1] || '';
                    const sigNum = sigAddr.match(/^(\d+)\s/)?.[1] || '';
                    const pStreet = pAddr.replace(/^\d+\s*/, '').substring(0, 15);
                    const sigStreet = sigAddr.replace(/^\d+\s*/, '').substring(0, 15);
                    
                    if (pNum && sigNum && pNum === sigNum && pStreet && sigStreet && pStreet === sigStreet) {
                        
                        // Inject signal and boost seller likelihood
                        prospect.signals.push({ text: `${sig.text} (${sig.source})`, type: 'positive' });
                        prospect.sellerLikelihood = clamp(prospect.sellerLikelihood + sig.weight, 0, 100);
                        prospect.confidence = clamp(prospect.confidence + 8, 0, 100); // exact match boosts confidence
                        prospect.briefingRank = Math.round(prospect.sellerLikelihood*0.50 + prospect.actionability*0.30 + prospect.offMarketReceptivity*0.15 + prospect.confidence*0.05);
                        prospect.scoreClass = prospect.briefingRank >= 55 ? 'high' : prospect.briefingRank >= 35 ? 'medium' : 'low';
                        prospect._marketSignal = sig;
                        marketMatches++;
                        break; // One match per property
                    }
                }
                
                // Also boost nearby properties when a recent sale is detected (comp activity)
                if (!prospect._marketSignal) {
                    const nearSold = marketSignals.filter(s => s.type === 'recently_sold');
                    const pNum = parseInt(pAddr.match(/^(\d+)/)?.[1] || '0');
                    const pStreetName = pAddr.replace(/^\d+\s*/, '').trim();
                    for (const sold of nearSold) {
                        const soldNum = parseInt(sold.address.match(/^(\d+)/)?.[1] || '0');
                        const soldStreet = sold.address.replace(/^\d+\s*/, '').trim();
                        if (pStreetName && soldStreet && pStreetName === soldStreet && Math.abs(pNum - soldNum) <= 200 && pNum !== soldNum) {
                            prospect.signals.push({ text: `Nearby sale on same street — comp awareness likely`, type: 'neutral' });
                            prospect.sellerLikelihood = clamp(prospect.sellerLikelihood + 2, 0, 100); // weak evidence only
                            prospect.briefingRank = Math.round(prospect.sellerLikelihood*0.50 + prospect.actionability*0.30 + prospect.offMarketReceptivity*0.15 + prospect.confidence*0.05);
                            prospect.scoreClass = prospect.briefingRank >= 55 ? 'high' : prospect.briefingRank >= 35 ? 'medium' : 'low';
                            break;
                        }
                    }
                }
            }
            console.log(`Market signal matches: ${marketMatches} parcels enriched`);
        }
        
        // Filter and sort
        allProspects = scored.filter(p => p.briefingRank >= 25 && p.scoreClass !== 'low' && p.address && p.address.length > 3).sort((a,b) => b.briefingRank - a.briefingRank);
        
        renderBriefing(allProspects, parcels.length, marketMatches, marketSignals.length);
        
    } catch(e) {
        console.error(e);
        document.getElementById('briefingContent').innerHTML = '<div class="empty-state">Error loading property data. Please try again.</div>';
    }
}

function renderBriefing(prospects, totalAnalyzed, marketMatches, totalMarketSignals) {
    const actions = getActions();
    const farmKey = 'ss_prev_' + (document.getElementById('farmInput').value||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'_');
    
    // ========================================
    // TIER SPLITTING — using four-score system
    // ========================================
    const enriched = prospects.map(p => {
        const contact = contactConfidence(p);
        const risk = falsePositiveRisk(p);
        // Global homeowner balancing: mild sort adjustment across all tiers
        const on = (p.ownerName || '').toUpperCase();
        const isOpaqueEnt = /\bLLC\b|\bCORP\b|\bINC\b|\bHOLDINGS\b|\bPARTNERSHIP\b/i.test(on) && !/TRUST|ESTATE|HEIRS|RANCH|FARM/i.test(on);
        const isNamedPerson = p.ownerName && p.ownerName.length > 3 && !isOpaqueEnt && !/TRUST|ESTATE|HEIRS|RANCH|FARM|LLC|CORP|INC/i.test(on);
        let sortBonus = 0;
        if (isNamedPerson && p.ownerAddress && p.ownerAddress.length > 5) sortBonus += 3;
        if (isOpaqueEnt && (!p.ownerAddress || p.ownerAddress.length < 5)) sortBonus -= 3;
        return { ...p, _contact: contact, _risk: risk, _sortRank: p.briefingRank + sortBonus };
    }).sort((a,b) => b._sortRank - a._sortRank);
    
    // Exclude skipped at data level
    const liveEnriched = enriched.filter(p => {
        const id = p.id || `${p.lat}-${p.lng}`;
        const act = actions[id];
        return !act || (act.action !== 'skipped');
    });
    
    // ACT TODAY: strong seller likelihood + high actionability + solid confidence + no risk
    let callToday = liveEnriched.filter(p => 
        p.sellerLikelihood >= 55 &&
        p.actionability >= 55 &&
        p.confidence >= 48 &&
        !p._risk
    );
    
    // Entity balance cap: if >50% of Act Today is opaque LLC/Corp, demote excess to Mail
    const entityRx = /\bLLC\b|\bCORP\b|\bINC\b|\bHOLDINGS\b|\bPARTNERSHIP\b/i;
    const isOpaqueEntity = (p) => entityRx.test(p.ownerName||'') && !/TRUST|ESTATE|HEIRS|RANCH|FARM/i.test(p.ownerName||'');
    const entityCount = callToday.filter(isOpaqueEntity).length;
    const maxEntities = Math.max(2, Math.ceil(callToday.length * 0.5));
    if (entityCount > maxEntities) {
        // Keep non-entities + top N entities by briefingRank
        const nonEntities = callToday.filter(p => !isOpaqueEntity(p));
        const entities = callToday.filter(isOpaqueEntity).sort((a,b) => b.briefingRank - a.briefingRank);
        callToday = [...nonEntities, ...entities.slice(0, maxEntities)].sort((a,b) => b.briefingRank - a.briefingRank);
    }
    const callIds = new Set(callToday.map(p => p.id || `${p.lat}-${p.lng}`));
    
    // MAIL THIS WEEK: moderate seller likelihood + off-market fit + actionable + has mail path
    const mailWeek = liveEnriched.filter(p => {
        const id = p.id || `${p.lat}-${p.lng}`;
        if (callIds.has(id)) return false;
        if (p.sellerLikelihood < 35) return false;
        if (p.offMarketReceptivity < 35) return false;
        if (p.actionability < 40) return false; // must be reasonably workable
        if (!p.ownerAddress || p.ownerAddress.length < 5) return false; // must have mailing address for mail
        if (p._risk) return false; // Any risk flag blocks mail placement
        return true;
    });
    const mailIds = new Set(mailWeek.map(p => p.id || `${p.lat}-${p.lng}`));
    
    // WATCH LIST: everything else that passed the initial filter
    const watchList = liveEnriched.filter(p => {
        const id = p.id || `${p.lat}-${p.lng}`;
        return !callIds.has(id) && !mailIds.has(id);
    });
    
    // Store rendered arrays for print and other workflows
    window._currentCallToday = callToday;
    window._currentMailWeek = mailWeek;
    window._currentWatchList = watchList;
    
    // ========================================
    // DIFF — namespaced by farm, using actual briefing tier
    // ========================================
    let newIds = [], movedUp = [], cooledOff = [];
    try {
        const prev = JSON.parse(localStorage.getItem(farmKey) || '{}');
        const prevIds = new Set(Object.keys(prev));
        const currMap = {};
        
        // Assign actual tier
        callToday.forEach(p => { const id = p.id || `${p.lat}-${p.lng}`; currMap[id] = { tier: 'call' }; });
        mailWeek.forEach(p => { const id = p.id || `${p.lat}-${p.lng}`; if (!currMap[id]) currMap[id] = { tier: 'mail' }; });
        watchList.forEach(p => { const id = p.id || `${p.lat}-${p.lng}`; if (!currMap[id]) currMap[id] = { tier: 'watch' }; });
        
        for (const id of Object.keys(currMap)) {
            if (!prevIds.has(id)) newIds.push(id);
            else if (prev[id]?.tier !== 'call' && currMap[id].tier === 'call') movedUp.push(id);
        }
        for (const id of prevIds) {
            if (!currMap[id]) cooledOff.push(id);
        }
        
        // Save AFTER successful tier assignment
        localStorage.setItem(farmKey, JSON.stringify(currMap));
    } catch(e) {}
    
    const hasChanges = newIds.length > 0 || movedUp.length > 0 || cooledOff.length > 0;
    
    // Stats
    const high = callToday.length;
    const med = mailWeek.length;
    const avgSL = prospects.length ? Math.round(prospects.reduce((s,p) => s + (p.sellerLikelihood||0), 0) / prospects.length) : 0;
    const withMarketSig = prospects.filter(p => p._marketSignal).length;
    
    document.getElementById('briefStats').innerHTML = `
        <div class="bstat"><div class="bstat-val">${totalAnalyzed}</div><div class="bstat-label">Analyzed</div></div>
        <div class="bstat"><div class="bstat-val green">${high}</div><div class="bstat-label">Act Today</div></div>
        <div class="bstat"><div class="bstat-val gold">${med}</div><div class="bstat-label">Mail This Week</div></div>
        <div class="bstat"><div class="bstat-val">${watchList.length}</div><div class="bstat-label">Watch List</div></div>
        <div class="bstat"><div class="bstat-val">${avgSL}</div><div class="bstat-label">Avg Sell Likelihood</div></div>
        ${withMarketSig > 0 ? `<div class="bstat"><div class="bstat-val" style="color:var(--accent)">${withMarketSig}</div><div class="bstat-label">Listing Activity</div></div>` : ''}
    `;
    
    let html = '';
    
    // Since Last Briefing banner
    if (hasChanges) {
        const parts = [];
        if (newIds.length) parts.push(`${newIds.length} new prospect${newIds.length>1?'s':''}`);
        if (movedUp.length) parts.push(`${movedUp.length} moved to Act Today`);
        if (cooledOff.length) parts.push(`${cooledOff.length} no longer in view`);
        html += `<div style="padding:14px 18px;background:var(--gold-dim);border:1px solid var(--gold-border);border-radius:var(--radius);margin-bottom:20px;display:flex;align-items:center;gap:10px;animation:fadeUp 0.3s ease">
            <span style="font-size:18px">⚡</span>
            <div>
                <div style="font-size:13px;font-weight:600;color:var(--accent)">Since Last Briefing</div>
                <div style="font-size:12px;color:var(--text-secondary)">${parts.join(' · ')}</div>
            </div>
        </div>`;
    }
    
    // Sections
    if (callToday.length > 0) {
        html += renderSection('🔥', 'fire', 'Act Today', `${callToday.length} high-confidence`, callToday, actions, 'call', newIds);
    } else if (mailWeek.length > 0) {
        // Fallback: promote top 5 cleanest Mail prospects as "Best Available"
        const bestAvailable = mailWeek.slice(0, 5);
        html += renderSection('📌', 'fire', 'Best Available Today', `Top ${bestAvailable.length} from ${mailWeek.length} prospects`, bestAvailable, actions, 'call', newIds);
    }
    if (mailWeek.length > 0) {
        html += renderSection('✉', 'mail', 'Mail This Week', `${mailWeek.length} with mail path`, mailWeek, actions, 'mail', newIds);
    }
    if (watchList.length > 0) {
        html += renderSection('👁', 'watch', 'Watch List', `${watchList.length} developing`, watchList, actions, 'watch', newIds);
    }
    
    if (!callToday.length && !mailWeek.length && !watchList.length) {
        html += '<div class="empty-state">No elevated-likelihood prospects found in this area. Try a different location or expand your farm.</div>';
    }
    
    document.getElementById('briefingContent').innerHTML = html;
}

function renderSection(icon, iconClass, title, countText, prospects, actions, tier, newIds) {
    const initialShow = tier === 'call' ? 5 : tier === 'mail' ? 7 : 10;
    const sectionId = `section-${tier}-${Date.now()}`;
    
    const cards = prospects.map((p, i) => {
        const id = p.id || `${p.lat}-${p.lng}`;
        const act = actions[id];
        const contacted = act?.action === 'contacted';
        const skipped = act?.action === 'skipped';
        const name = normalizeName(p.ownerName);
        const val = p.totalValue ? `$${(p.totalValue/1000).toFixed(0)}K assessed` : '';
        const script = generateScript(p, p.cohort);
        const why = whyNow(p);
        const contact = contactConfidence(p);
        const channel = bestChannel(p);
        const risk = falsePositiveRisk(p);
        const isNew = newIds && newIds.includes(id);
        const hidden = i >= initialShow ? ' style="display:none" data-overflow="' + sectionId + '"' : '';
        
        return `<div class="prospect ${contacted?'contacted':''}"${hidden} id="card-${id}" onclick="toggleExpand('${id}')">
            <div class="prospect-main">
                <div class="prospect-score ${p.scoreClass}">${p.briefingRank}</div>
                <div class="prospect-info">
                    <div class="prospect-addr">${isNew ? '<span style="color:var(--accent);font-size:9px;font-weight:700;margin-right:6px;letter-spacing:0.06em;padding:1px 5px;background:rgba(196,168,124,0.15);border-radius:3px">NEW</span>' : ''}${name || p.address}${name ? ` <span style="color:var(--text-dim);font-weight:400">— ${p.address}</span>` : ''}</div>
                    <div class="prospect-why">↗ ${why}</div>
                    <div class="prospect-meta">
                        <span class="chip chip-channel">${channel.icon} ${channel.channel}</span>
                        <span class="chip chip-contact ${contact.level}">${contact.level === 'high' ? '● Strong mail path' : contact.level === 'medium' ? '◐ Usable mail path' : '○ Needs contact lookup'}</span>
                        ${risk ? '<span class="chip chip-risk">⚠ Risk flag</span>' : ''}
                    </div>
                </div>
                <div class="prospect-actions">
                    ${tier === 'call' ? `
                        <button class="action-btn ${contacted?'done':'primary'}" onclick="event.stopPropagation();markAction('${id}','contacted')">${contacted?'✓ Done': channel.channel.includes('Letter') ? 'Mail' : 'Call'}</button>
                        <button class="action-btn ${skipped?'skip':''}" onclick="event.stopPropagation();markAction('${id}','skipped')">Skip</button>
                    ` : tier === 'mail' ? `
                        <button class="action-btn ${contacted?'done':''}" onclick="event.stopPropagation();markAction('${id}','contacted')">${contacted?'✓ Sent':'Mail'}</button>
                    ` : `
                        <button class="action-btn" onclick="event.stopPropagation();markAction('${id}','watching')">Track</button>
                        ${/LLC|CORP|INC|HOLDINGS|PARTNERSHIP/i.test(p.ownerName||'') ? `<button class="action-btn" style="font-size:10px" onclick="event.stopPropagation();window.open('sellersignal-map.html?search=${encodeURIComponent(p.address + (p.cityStateZip ? ', '+p.cityStateZip : ''))}','_blank')">🔍 ID Owner</button>` : ''}
                    `}
                </div>
            </div>
            <div class="prospect-detail" id="detail-${id}">
                ${risk ? `<div style="padding:10px 14px;background:var(--red-dim);border-left:3px solid var(--red);border-radius:4px;margin-top:12px;font-size:12px;color:var(--red)"><strong>False positive risk:</strong> ${risk}</div>` : ''}
                <div style="display:flex;gap:12px;margin-top:14px;margin-bottom:14px;padding:12px;background:rgba(17,25,33,0.6);border-radius:8px;border:1px solid var(--border)">
                    <div style="flex:1;text-align:center"><div style="font-size:18px;font-weight:700;color:${p.sellerLikelihood>=50?'var(--green)':p.sellerLikelihood>=30?'var(--accent)':'var(--text-dim)'}">${p.sellerLikelihood}</div><div style="font-size:9px;color:var(--text-dim);letter-spacing:0.04em;margin-top:2px">SELL LIKELIHOOD</div></div>
                    <div style="flex:1;text-align:center"><div style="font-size:18px;font-weight:700;color:var(--text-secondary)">${p.offMarketReceptivity}</div><div style="font-size:9px;color:var(--text-dim);letter-spacing:0.04em;margin-top:2px">OFF-MARKET FIT</div></div>
                    <div style="flex:1;text-align:center"><div style="font-size:18px;font-weight:700;color:var(--text-secondary)">${p.actionability}</div><div style="font-size:9px;color:var(--text-dim);letter-spacing:0.04em;margin-top:2px">ACTIONABILITY</div></div>
                    <div style="flex:1;text-align:center"><div style="font-size:18px;font-weight:700;color:var(--text-secondary)">${p.confidence}</div><div style="font-size:9px;color:var(--text-dim);letter-spacing:0.04em;margin-top:2px">CONFIDENCE</div></div>
                </div>
                <div class="detail-grid">
                    <div class="detail-item"><div class="detail-label">Cohort</div><div class="detail-value highlight">${p.cohortLabel}</div></div>
                    <div class="detail-item"><div class="detail-label">Transfer History</div><div class="detail-value">${p.tenureYears !== null && p.tenureYears !== undefined ? 'Last sale: ' + (p.lastTransferDate||'') + ' (' + Math.round(p.tenureYears) + 'yr ago)' : p.tenureLongTerm ? 'No sale in past 3 years' : 'No data available'}</div></div>
                    <div class="detail-item"><div class="detail-label">County Assessed</div><div class="detail-value">${val || 'N/A'}</div></div>
                    <div class="detail-item"><div class="detail-label">Property Type</div><div class="detail-value">${p.propType || 'Residential'}</div></div>
                    <div class="detail-item"><div class="detail-label">Best Channel</div><div class="detail-value">${channel.channel} — ${channel.reason}</div></div>
                    <div class="detail-item"><div class="detail-label">Contact Path</div><div class="detail-value">${contact.reason}</div></div>
                </div>
                <div class="script-preview">
                    <div class="script-label">Suggested Opening</div>
                    <div class="script-text">"${script}"</div>
                </div>
                <div class="detail-actions">
                    <button class="detail-btn deep" onclick="event.stopPropagation();window.open('sellersignal-map.html?search=${encodeURIComponent(p.address + (p.cityStateZip ? ', '+p.cityStateZip : ''))}&autoDeep=true','_blank')">Run Deep Signal</button>
                    <button class="detail-btn" onclick="event.stopPropagation();copyScript('${id}')">Copy Script</button>
                    <button class="detail-btn" onclick="event.stopPropagation();window.open('https://maps.google.com/?q=${encodeURIComponent(p.address + (p.cityStateZip ? ', '+p.cityStateZip : ''))}','_blank')">Google Maps</button>
                </div>
            </div>
        </div>`;
    }).join('');
    
    // 4. PRINT ALL LETTERS for Mail This Week
    const printBtn = tier === 'mail' ? `<button class="action-btn" style="margin-left:auto;font-size:11px" onclick="event.stopPropagation();printAllLetters()">🖨 Print All Letters</button>` : '';
    
    const showMoreBtn = prospects.length > initialShow ? `<button class="action-btn" style="width:100%;margin-top:8px;text-align:center;justify-content:center;display:flex;padding:10px" onclick="toggleShowAll('${sectionId}',this)" id="btn-${sectionId}">Show all ${prospects.length} (${prospects.length - initialShow} more)</button>` : '';
    
    return `<div class="section">
        <div class="section-header">
            <div class="section-icon ${iconClass}">${icon}</div>
            <div class="section-title">${title}</div>
            <div class="section-count">${prospects.length} total</div>
            ${printBtn}
        </div>
        ${cards}
        ${showMoreBtn}
    </div>`;
}

function toggleExpand(id) {
    const card = document.getElementById(`card-${id}`);
    if (card) card.classList.toggle('expanded');
}

function toggleShowAll(sectionId, btn) {
    const hidden = document.querySelectorAll(`[data-overflow="${sectionId}"]`);
    const currentlyHidden = hidden[0]?.style.display === 'none';
    hidden.forEach(el => { el.style.display = currentlyHidden ? '' : 'none'; });
    btn.textContent = currentlyHidden ? 'Show fewer' : `Show all (${hidden.length} more)`;
}

function markAction(id, action) {
    setAction(id, action);
    const card = document.getElementById(`card-${id}`);
    if (action === 'contacted' && card) card.classList.add('contacted');
    if (action === 'skipped' && card) card.style.display = 'none';
    // Re-render buttons
    const btn = card?.querySelector('.action-btn.primary, .action-btn.done');
    if (btn && action === 'contacted') { btn.classList.remove('primary'); btn.classList.add('done'); btn.textContent = '✓ Done'; }
}

function copyScript(id) {
    const detail = document.getElementById(`detail-${id}`);
    const scriptEl = detail?.querySelector('.script-text');
    if (scriptEl) {
        navigator.clipboard.writeText(scriptEl.textContent.replace(/^"|"$/g,'')).then(() => {
            const btn = detail.querySelector('.detail-btn:nth-child(2)');
            if (btn) { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy Script', 1500); }
        });
    }
}

// ========================
// PRINT ALL LETTERS — batch mail workflow
// ========================
function printAllLetters() {
    const mailProspects = window._currentMailWeek || [];
    if (mailProspects.length === 0) { alert('No mail prospects available.'); return; }
    
    const letters = mailProspects.map(p => {
        const name = normalizeName(p.ownerName) || 'Property Owner';
        const addr = p.address + (p.cityStateZip ? ', ' + p.cityStateZip : '');
        const script = generateScript(p, p.cohort);
        const mailingAddr = p.ownerAddress || addr;
        return { name, addr, mailingAddr, script, cohort: p.cohortLabel };
    });
    
    const printWin = window.open('', '_blank');
    printWin.document.write(`<!DOCTYPE html><html><head><title>SellerSignal — Letters</title>
    <style>
        @page { size: letter; margin: 1in; }
        body { font-family: Georgia, serif; font-size: 13px; line-height: 1.7; color: #1a1a1a; }
        .letter { page-break-after: always; padding: 0; }
        .letter:last-child { page-break-after: auto; }
        .letter-header { margin-bottom: 32px; }
        .letter-date { font-size: 12px; color: #666; margin-bottom: 24px; }
        .letter-to { margin-bottom: 24px; font-size: 13px; }
        .letter-body { font-size: 13px; line-height: 1.8; }
        .letter-sig { margin-top: 32px; }
        .letter-sig .name { font-weight: bold; }
        .print-header { text-align: center; padding: 16px; background: #f5f5f5; margin-bottom: 24px; font-family: sans-serif; font-size: 12px; color: #666; }
        @media print { .print-header { display: none; } }
    </style></head><body>
    <div class="print-header">${letters.length} letters generated by SellerSignal — <button onclick="window.print()">Print All</button></div>
    ${letters.map(l => `<div class="letter">
        <div class="letter-header">
            <div class="letter-date">${new Date().toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' })}</div>
            <div class="letter-to">${l.name}<br>${l.mailingAddr}</div>
        </div>
        <div class="letter-body">
            <p>Dear ${l.name.split(' ')[0] || 'Homeowner'},</p>
            <p>${l.script}</p>
            <p>If you would be open to a confidential conversation about your property's position in today's market, I would welcome the opportunity to connect at your convenience.</p>
        </div>
        <div class="letter-sig">
            <div class="name">[AGENT_NAME]</div>
            <div>[BROKERAGE]</div>
            <div>[PHONE]</div>
        </div>
    </div>`).join('')}
    </body></html>`);
    printWin.document.close();
}

// INIT
// ========================
document.getElementById('farmInput').addEventListener('keydown', e => { if (e.key === 'Enter') startBriefing(); });

// Check for saved farm
try {
    const savedFarm = localStorage.getItem('ss_farm');
    if (savedFarm) {
        document.getElementById('farmInput').value = savedFarm;
    }
} catch(e) {}

// Save farm on load
const origStart = startBriefing;
startBriefing = function() {
    const v = document.getElementById('farmInput').value.trim();
    if (v) try { localStorage.setItem('ss_farm', v); } catch(e) {}
    return origStart();
};
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SellerSignal — Daily Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
    --bg:#070b10;--bg-card:#0e1419;--bg-card-hover:#141c24;--bg-elevated:#111921;
    --text:#f0ede8;--text-secondary:#7e8d9c;--text-dim:#4a5768;
    --gold:#c4a87c;--gold-dim:rgba(196,168,124,0.12);--gold-border:rgba(196,168,124,0.25);--accent:#c4a87c;
    --green:#4ade80;--green-dim:rgba(74,222,128,0.1);--green-border:rgba(74,222,128,0.2);
    --yellow:#fbbf24;--yellow-dim:rgba(251,191,36,0.1);
    --red:#f87171;--red-dim:rgba(248,113,113,0.08);
    --border:#172030;--border-light:#1e2d3d;
    --radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
::selection{background:var(--gold);color:var(--bg)}

/* Header */
.header{padding:16px 32px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(7,11,16,0.92);backdrop-filter:blur(20px);z-index:100}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.logo-mark{width:28px;height:28px;border:2px solid var(--text);border-radius:50%;display:flex;align-items:flex-end;justify-content:center;gap:2px;padding-bottom:6px}
.logo-mark .bar{width:2.5px;background:var(--text);border-radius:1px}
.logo-mark .bar:nth-child(1){height:4px}.logo-mark .bar:nth-child(2){height:7px}.logo-mark .bar:nth-child(3){height:11px}
.logo-text{font-family:'DM Serif Display',serif;font-size:18px}
.header-actions{display:flex;gap:12px;align-items:center}
.nav-btn{padding:8px 16px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text-secondary);font-size:12px;font-weight:500;cursor:pointer;font-family:'Outfit',sans-serif;transition:all 0.2s;text-decoration:none;display:flex;align-items:center;gap:6px}
.nav-btn:hover{border-color:var(--gold);color:var(--gold)}
.nav-btn.active{background:var(--gold-dim);border-color:var(--gold-border);color:var(--gold)}

/* Farm Setup */
.farm-setup{max-width:480px;margin:120px auto;text-align:center;padding:0 24px;animation:fadeUp 0.5s ease}
.farm-setup h1{font-family:'DM Serif Display',serif;font-size:32px;margin-bottom:12px;color:var(--text)}
.farm-setup p{color:var(--text-secondary);font-size:15px;line-height:1.6;margin-bottom:32px}
.farm-input-row{display:flex;gap:10px}
.farm-input{flex:1;padding:14px 18px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:15px;font-family:'Outfit',sans-serif;outline:none;transition:border-color 0.2s}
.farm-input:focus{border-color:var(--gold)}
.farm-input::placeholder{color:var(--text-dim)}
.farm-go{padding:14px 28px;background:var(--gold);color:var(--bg);border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;transition:background 0.2s;white-space:nowrap}
.farm-go:hover{background:#d4b88c}
.quick-btn{padding:5px 14px;background:rgba(17,25,33,0.85);border:1px solid var(--border);border-radius:20px;color:var(--text-secondary);font-size:11px;cursor:pointer;font-family:'Outfit',sans-serif;transition:all 0.2s}
.quick-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Dashboard */
.dashboard{max-width:900px;margin:0 auto;padding:24px 24px 80px;display:none}
.dashboard.active{display:block}

/* Briefing Header */
.briefing-header{margin-bottom:32px;animation:fadeUp 0.4s ease}
.briefing-date{font-size:12px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.briefing-title{font-family:'DM Serif Display',serif;font-size:28px;color:var(--text);margin-bottom:4px}
.briefing-farm{font-size:14px;color:var(--text-secondary)}
.briefing-stats{display:flex;gap:24px;margin-top:20px;padding:16px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.bstat{display:flex;flex-direction:column;gap:2px}
.bstat-val{font-size:22px;font-weight:700;color:var(--text)}
.bstat-val.gold{color:var(--gold)}
.bstat-val.green{color:var(--green)}
.bstat-label{font-size:11px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-dim)}

/* Section */
.section{margin-bottom:36px;animation:fadeUp 0.4s ease}
.section-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.section-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.section-icon.fire{background:var(--green-dim);border:1px solid var(--green-border)}
.section-icon.mail{background:var(--gold-dim);border:1px solid var(--gold-border)}
.section-icon.watch{background:var(--red-dim);border:1px solid rgba(248,113,113,0.15)}
.section-title{font-family:'DM Serif Display',serif;font-size:18px;color:var(--text)}
.section-count{font-size:12px;color:var(--text-dim);margin-left:auto}

/* Prospect Card */
.prospect{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;transition:all 0.2s;cursor:default}
.prospect:hover{border-color:var(--border-light);background:var(--bg-card-hover)}
.prospect.contacted{opacity:0.5}
.prospect-main{display:grid;grid-template-columns:40px 1fr auto;gap:14px;padding:14px 18px;align-items:center}
.prospect-score{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;border:2px solid rgba(0,0,0,0.3);flex-shrink:0}
.prospect-score.high{background:rgba(74,222,128,0.15);color:var(--green);border-color:var(--green-border)}
.prospect-score.medium{background:var(--yellow-dim);color:var(--yellow);border-color:rgba(251,191,36,0.2)}
.prospect-score.low{background:var(--red-dim);color:var(--red);border-color:rgba(248,113,113,0.15)}
.prospect-info{min-width:0}
.prospect-addr{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prospect-meta{display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap}
.prospect-cohort{padding:2px 8px;border-radius:3px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;background:var(--gold-dim);color:var(--gold);border:1px solid var(--gold-border)}
.prospect-signal{font-size:12px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
.prospect-om{font-size:11px;color:var(--text-dim)}
.prospect-why{font-size:12px;color:var(--accent);font-weight:500;margin-top:4px;line-height:1.4}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:600;letter-spacing:0.03em}
.chip-channel{background:rgba(196,168,124,0.1);color:var(--accent);border:1px solid rgba(196,168,124,0.2)}
.chip-contact{border:1px solid var(--border)}
.chip-contact.high{color:var(--text);border-color:var(--border-light);background:rgba(240,237,232,0.06)}
.chip-contact.medium{color:var(--text-secondary);border-color:var(--border-light);background:rgba(240,237,232,0.04)}
.chip-contact.low{color:var(--red);border-color:rgba(248,113,113,0.15);background:rgba(248,113,113,0.06)}
.chip-risk{background:var(--red-dim);color:var(--red);border:1px solid rgba(248,113,113,0.15)}
.prospect-actions{display:flex;gap:6px;flex-shrink:0}
.action-btn{padding:8px 14px;background:transparent;border:1px solid var(--border);border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;transition:all 0.15s;color:var(--text-secondary)}
.action-btn:hover{border-color:var(--gold);color:var(--gold)}
.action-btn.primary{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.action-btn.primary:hover{background:#d4b88c}
.action-btn.done{background:var(--green-dim);border-color:var(--green-border);color:var(--green)}
.action-btn.skip{opacity:0.6}

/* Expanded detail */
.prospect-detail{display:none;padding:0 20px 16px;border-top:1px solid var(--border);margin-top:0}
.prospect.expanded .prospect-detail{display:block}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.detail-item{display:flex;flex-direction:column;gap:2px}
.detail-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim)}
.detail-value{font-size:13px;color:var(--text-secondary)}
.detail-value.highlight{color:var(--gold);font-weight:600}
.script-preview{margin-top:14px;padding:14px;background:var(--bg);border-radius:8px;border-left:3px solid var(--gold)}
.script-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--gold);margin-bottom:6px}
.script-text{font-size:13px;color:var(--text-secondary);line-height:1.6;font-style:italic}
.detail-actions{display:flex;gap:8px;margin-top:14px}
.detail-btn{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;font-family:'Outfit',sans-serif;color:var(--text-secondary);transition:all 0.15s}
.detail-btn:hover{border-color:var(--gold);color:var(--gold)}
.detail-btn.deep{background:var(--gold);border-color:var(--gold);color:var(--bg);font-weight:600}
.detail-btn.deep:hover{background:#d4b88c}

/* Loading */
.loading-state{text-align:center;padding:60px 24px;animation:fadeUp 0.3s ease}
.loading-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14px;color:var(--text-secondary)}
.loading-sub{font-size:12px;color:var(--text-dim);margin-top:4px}

/* Empty state */
.empty-state{text-align:center;padding:48px 24px;color:var(--text-dim);font-size:14px;line-height:1.6}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.stagger-1{animation-delay:0.05s}.stagger-2{animation-delay:0.1s}.stagger-3{animation-delay:0.15s}
.stagger-4{animation-delay:0.2s}.stagger-5{animation-delay:0.25s}.stagger-6{animation-delay:0.3s}

/* Responsive */
@media(max-width:640px){
    .prospect-main{grid-template-columns:36px 1fr;gap:10px}
    .prospect-actions{display:none}
    .prospect-meta{gap:4px}
    .detail-grid{grid-template-columns:1fr}
    .briefing-stats{flex-wrap:wrap;gap:16px}
    .farm-input-row{flex-direction:column}
}
</style>
</head>
<body>

<header class="header">
    <a class="logo"><div class="logo-mark"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div><span class="logo-text">SellerSignal</span></a>
    <div class="header-actions">
        <a class="nav-btn active" id="navBriefing" onclick="showView('briefing')">Briefing</a>
        <a class="nav-btn" id="navMap" href="sellersignal-map.html">Map</a>
    </div>
</header>

<!-- Farm Setup -->
<div class="farm-setup" id="farmSetup">
    <h1>Your Daily Briefing</h1>
    <p>Enter a ZIP code to see today's highest-priority prospects — ranked, scored, and ready to contact.</p>
    <div class="farm-input-row">
        <input class="farm-input" id="farmInput" type="text" placeholder="ZIP code (e.g. 59718) or address">
        <button class="farm-go" onclick="startBriefing()">Run Briefing</button>
    </div>
    <div style="margin-top:16px;text-align:center">
        <div style="font-size:10px;color:var(--text-dim);letter-spacing:0.06em;margin-bottom:8px">MONTANA</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:12px">
            <button class="quick-btn" onclick="document.getElementById('farmInput').value='59715';startBriefing()">59715 · Bozeman</button>
            <button class="quick-btn" onclick="document.getElementById('farmInput').value='59718';startBriefing()">59718 · Bozeman W</button>
            <button class="quick-btn" onclick="document.getElementById('farmInput').value='59937';startBriefing()">59937 · Whitefish</button>
            <button class="quick-btn" onclick="document.getElementById('farmInput').value='59716';startBriefing()">59716 · Big Sky</button>
            <button class="quick-btn" onclick="document.getElementById('farmInput').value='59801';startBriefing()">59801 · Missoula</button>
            <button class="quick-btn" onclick="document.getElementById('farmInput').value='59711';startBriefing()">59711 · Anaconda</button>
        </div>
        <div style="font-size:10px;color:var(--text-dim);letter-spacing:0.06em;margin-bottom:8px">KING COUNTY, WA</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">
            <button class="quick-btn" onclick="document.getElementById('farmInput').value='98112';startBriefing()">98112 · Capitol Hill</button>
            <button class="quick-btn" onclick="document.getElementById('farmInput').value='98103';startBriefing()">98103 · Fremont</button>
            <button class="quick-btn" onclick="document.getElementById('farmInput').value='98109';startBriefing()">98109 · Queen Anne</button>
            <button class="quick-btn" onclick="document.getElementById('farmInput').value='98004';startBriefing()">98004 · Bellevue</button>
            <button class="quick-btn" onclick="document.getElementById('farmInput').value='98040';startBriefing()">98040 · Mercer Island</button>
            <button class="quick-btn" onclick="document.getElementById('farmInput').value='98033';startBriefing()">98033 · Kirkland</button>
        </div>
    </div>
</div>

<!-- Dashboard -->
<div class="dashboard" id="dashboard">
    <div class="briefing-header">
        <div class="briefing-date" id="briefDate"></div>
        <div class="briefing-title">Daily Briefing</div>
        <div class="briefing-farm" id="briefFarm"></div>
        <div class="briefing-stats" id="briefStats"></div>
    </div>
    
    <div id="briefingContent">
        <div class="loading-state">
            <div class="loading-spinner"></div>
            <div class="loading-text">Analyzing properties...</div>
            <div class="loading-sub" id="loadingSub">Pulling parcel data from public records</div>
        </div>
    </div>
</div>

<script>
// ========================
// DATA SOURCES
// ========================
const SOURCES={
MT:{name:'Montana',url:'https://gisservicemt.gov/arcgis/rest/services/MSDI_Framework/Parcels/MapServer/0/query',
fields:'OwnerName,AddressLine1,CityStateZip,TotalValue,TotalBuildingValue,TotalLandValue,PropType,GISAcres,Subdivision,OwnerAddress1,OwnerCity,OwnerState,OwnerZipCode,PARCELID',
max:2000,bounds:{south:44.35,north:49.0,west:-116.05,east:-104.04},
zipWhere: (zip) => `CityStateZip LIKE '%${zip}%'`,
parse(f){const a=f.attributes;let lat=0,lng=0;if(f.centroid){lng=f.centroid.x;lat=f.centroid.y}else if(f.geometry?.rings?.[0]?.length){const r=f.geometry.rings[0];lng=r.reduce((s,p)=>s+p[0],0)/r.length;lat=r.reduce((s,p)=>s+p[1],0)/r.length}
return{id:a.PARCELID,ownerName:a.OwnerName||'',address:(a.AddressLine1||'').trim(),cityStateZip:(a.CityStateZip||'').trim(),totalValue:a.TotalValue||0,buildingValue:a.TotalBuildingValue||0,landValue:a.TotalLandValue||0,propType:a.PropType||'',acres:a.GISAcres||0,subdivision:a.Subdivision||'',ownerAddress:(a.OwnerAddress1||'').trim(),ownerState:(a.OwnerState||'').trim(),exempt:a.PropType==='Exempt Property',lat,lng}}},
WA_KING:{name:'King County, WA',url:'https://services.arcgis.com/Ej0PsM5Aw677QF1W/arcgis/rest/services/PARCEL_ADDRESS_PUB_AREA_3069/FeatureServer/0/query',
fields:'PAAUNIQUENAME,KCTP_ATTN,ADDR_FULL,CTYNAME,KCTP_ADDR,KCTP_CTYST,KCTP_STATE,APPRLNDVAL,APPR_IMPR,TAX_LNDVAL,TAX_IMPR,PLAT_NAME,KCA_ACRES,PREUSE_DESC,PIN,LAT,LON,ZIP5',
max:2000,bounds:{south:47.0,north:47.8,west:-122.6,east:-121.0},
zipWhere: (zip) => `ZIP5='${zip}'`,
parse(f){const a=f.attributes;const rawOwner=(a.PAAUNIQUENAME||a.KCTP_ATTN||'').trim();const lv=a.APPRLNDVAL||a.TAX_LNDVAL||0;const bv=a.APPR_IMPR||a.TAX_IMPR||0;
// Clean owner name — strip mailing label junk
let owner = rawOwner;
owner = owner.replace(/\bC\/?O\b.*/i, '').trim(); // strip C/O and everything after
owner = owner.replace(/\bATTN\b.*/i, '').trim();
owner = owner.replace(/\bCARE OF\b.*/i, '').trim();
owner = owner.replace(/\bTAX\s*PROPERTY\b/i, '').trim();
owner = owner.replace(/\bCURRENT\s*RESIDENT\b/i, '').trim();
owner = owner.replace(/\bOCCUPANT\b/i, '').trim();
owner = owner.replace(/\bPROPERTY\s*OWNER\b/i, '').trim();
// If cleaned name is too short or obviously junk, blank it
if (owner.length < 3 || /^[A-Z]{1,2}$|^\d+$|^UNKNOWN$/i.test(owner)) owner = '';
let lat=a.LAT||0,lng=a.LON||0;if((!lat||!lng)&&f.centroid){lng=f.centroid.x;lat=f.centroid.y}else if((!lat||!lng)&&f.geometry?.rings?.[0]?.length){const r=f.geometry.rings[0];lng=r.reduce((s,p)=>s+p[0],0)/r.length;lat=r.reduce((s,p)=>s+p[1],0)/r.length}
const site=(a.ADDR_FULL||'').toLowerCase();const mail=(a.KCTP_ADDR||'').toLowerCase();
const mailDiff=mail&&site&&site.length>5&&!mail.includes(site.substring(0,Math.min(8,site.length)));
const isEntity=owner&&/LLC|TRUST|CORP|INC|FOUNDATION|GROUP|PARTNERS|ASSOC|RANCH|FARM|PROPERTIES|INVESTMENTS|VENTURES|ENTERPRISES|DEVELOPMENT|REALTY|MANAGEMENT/i.test(owner);
return{id:a.PIN,ownerName:owner,rawOwnerName:rawOwner,address:(a.ADDR_FULL||'').trim(),cityStateZip:`${a.CTYNAME||'Seattle'}, WA`,totalValue:lv+bv,buildingValue:bv,landValue:lv,propType:(a.PREUSE_DESC||'').trim(),acres:a.KCA_ACRES||0,subdivision:(a.PLAT_NAME||'').trim(),ownerAddress:mail,ownerState:(a.KCTP_STATE||'').trim(),exempt:/exempt|government/i.test(a.PREUSE_DESC||''),lat,lng,mailDiffers:mailDiff}},
salesUrl:'https://services.arcgis.com/Ej0PsM5Aw677QF1W/arcgis/rest/services/PARCEL_SALES3YR_AREA_287/FeatureServer/0/query',
salesFields:'PIN,SaleDate,SalePrice,Sellername,buyername'
}
};

// ========================
// SCORING ENGINE v3 — Four separate scores
// Seller Likelihood | Off-Market Receptivity | Actionability | Confidence
// ========================

function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

function precomputeStats(parcels) {
    const valid = parcels.filter(x => x.totalValue > 0 && !x.exempt);
    const values = valid.map(x => x.totalValue).sort((a,b) => a-b);
    const p75Value = values[Math.floor(values.length * 0.75)] || 0;
    
    // Pre-compute multi-property counts
    const ownerCounts = {};
    for (const p of valid) {
        if (p.ownerName && p.ownerName.length > 3) {
            const key = p.ownerName.toUpperCase().trim();
            ownerCounts[key] = (ownerCounts[key] || 0) + 1;
        }
    }
    return { p75Value, ownerCounts };
}

function scoreParcel(p, stats) {
    const { p75Value, ownerCounts } = stats;
    const signals = [];
    
    // Bail on exempt
    if (p.exempt) return {sellerLikelihood:0,offMarketReceptivity:0,actionability:0,confidence:0,briefingRank:0,scoreClass:'low',signals:[],cohort:'residential',cohortLabel:'Residential'};
    
    // Institutional filter
    const govRx = /\bCITY OF\b|\bCOUNTY OF\b|\bSTATE OF\b|\bUNITED STATES\b|\bFEDERAL\b|\bMUNICIPAL\b|\bSCHOOL DIST|\bFIRE DIST|\bWATER DIST|\bSEWER\b|\bHOUSING AUTH|\bCHURCH\b|\bDIOCESE\b|\bHOA\b|\bHOMEOWNERS?\s*ASS|\bCOMMON\s*AREA|\bMUSEUM\b|\bCONDO\s*MASTER|\bCONDO\s*ASSOC|\bCONDOMINIUM\s*ASS|\bPARK\s*AREA|\bOWNERS?\s*ASSOC|\bPROPERTY\s*OWNERS|\bMASTER\s*ASSOC|\bCOMMUNITY\s*ASSOC|\bNEIGHBORHOOD\s*ASSOC|\bIRRIGATION|\bCEMETERY|\bLIBRARY|\bFOUNDATION\b|\bUNIVERSITY\b|\bCOLLEGE\b|\bMONTANA STATE\b|\bSUB\s+[A-Z]/i;
    if (p.ownerName && govRx.test(p.ownerName)) return {sellerLikelihood:0,offMarketReceptivity:0,actionability:0,confidence:0,briefingRank:0,scoreClass:'low',signals:[{text:'Government/institutional',type:'negative'}],cohort:'residential',cohortLabel:'Institutional'};
    
    // No-address filter
    const on = (p.ownerName || '').toUpperCase();
    if (!p.address && (!on || on.length < 4)) return {sellerLikelihood:0,offMarketReceptivity:0,actionability:0,confidence:0,briefingRank:0,scoreClass:'low',signals:[],cohort:'residential',cohortLabel:'Unknown'};

    // -----------------------------------------------
    // CLASSIFY PROPERTY TRAITS
    // -----------------------------------------------
    const pa = (p.address||'').toLowerCase().replace(/\s+/g,'');
    const oa = (p.ownerAddress||'').toLowerCase().replace(/\s+/g,'');
    const isAbsentee = p.mailDiffers || (oa && pa && pa.length > 5 && !oa.includes(pa.substring(0, Math.min(10, pa.length))));
    const isOutOfState = p.ownerState && !['MT','WA'].includes(p.ownerState.toUpperCase());
    const pt = (p.propType || '').toLowerCase();
    const isVacant = pt.includes('vacant') || pt.includes('land') || (p.totalValue > 0 && p.buildingValue === 0);
    const landHeavy = p.totalValue > 0 && p.landValue > 0 && p.buildingValue > 0 && (p.landValue / p.totalValue) > 0.6;
    const isHighValue = p.totalValue > 0 && p75Value > 0 && p.totalValue > p75Value;
    const isLuxury = !isVacant && p.totalValue > 750000 && p75Value > 0 && p.totalValue > p75Value * 1.5;
    const hasMailingAddr = p.ownerAddress && p.ownerAddress.length > 5;
    const hasOwnerName = on && on.length > 3;
    
    // Owner name quality — detect weak/junk names that survived cleaning
    const isJunkName = hasOwnerName && (
        /\bMANAGEMENT\b|\bPROPERTY\b|\bSERVICE|\bAGENCY\b|\bDEPARTMENT\b|\bOFFICE\b|\bCOMMITTEE\b|\bBOARD\b/i.test(on) && !isEntity ||
        on.split(/\s+/).length === 1 || // single word names are suspicious
        /^\d/.test(on) // starts with a number
    );
    const hasCleanOwnerName = hasOwnerName && !isJunkName;
    
    // Entity classification
    const isLLC = /\bLLC\b|\bCORP\b|\bINC\b|\bPARTNERSHIP\b|\bHOLDINGS\b|\bPROPERTIES\b|\bINVESTMENTS\b|\bGROUP\b|\bREALTY\b|\bMANAGEMENT\b/i.test(on);
    const isTrust = /\bTRUST\b/i.test(on);
    const isEstate = /\bESTATE\b/i.test(on);
    const isHeirs = /\bHEIRS\b|\bDECEASED\b|\bSURVIVOR\b/i.test(on);
    const isRanch = /\bRANCH\b|\bFARM\b/i.test(on);
    const isEntity = isLLC || isTrust || isEstate || isHeirs || isRanch;
    const isCorporateOpaque = isLLC && !isTrust && !isEstate && !isHeirs && !isRanch;
    
    // Multi-property detection (pre-computed)
    let multiCount = 1;
    if (hasOwnerName) {
        const ownerKey = on.trim();
        multiCount = ownerCounts[ownerKey] || 1;
    }
    const isSmallPortfolio = multiCount >= 2 && multiCount <= 5;
    const isLargePortfolio = multiCount > 5;
    
    // Operational property detection
    const isOperational = isRanch && p.acres > 20;
    
    // -----------------------------------------------
    // 1. SELLER LIKELIHOOD (0-100)
    // How likely is this owner to sell in the next 6-24 months?
    // Driven by transition signals, NOT structural complexity
    // -----------------------------------------------
    let sellerLikelihood = 20; // neutral base
    
    // === OWNERSHIP TRANSITION SIGNALS (strongest) ===
    if (isHeirs) {
        signals.push({text:'Heir/deceased/survivor — likely transition',type:'positive'});
        sellerLikelihood += 22;
    }
    if (isEstate && !isHeirs) {
        signals.push({text:'Estate ownership — may be in settlement',type:'positive'});
        sellerLikelihood += 18;
    }
    if (isTrust && isAbsentee) {
        signals.push({text:'Trust + absentee — succession or remote management',type:'positive'});
        sellerLikelihood += 16;
    } else if (isTrust && !isHeirs && !isEstate) {
        signals.push({text:'Trust ownership — possible succession planning',type:'neutral'});
        sellerLikelihood += 8; // trust alone is moderate, not strong
    }
    
    // === ABSENTEE + DISTANCE (moderate-strong when combined) ===
    if (isAbsentee && isOutOfState) {
        signals.push({text:`Out-of-state absentee (${p.ownerState}) — distance creates friction`,type:'positive'});
        sellerLikelihood += 14;
    } else if (isOutOfState) {
        signals.push({text:`Out-of-state owner (${p.ownerState})`,type:'positive'});
        sellerLikelihood += 8;
    } else if (isAbsentee) {
        signals.push({text:'Absentee owner — not occupying property',type:'neutral'});
        sellerLikelihood += 6;
    }
    
    // === UTILIZATION / BURDEN SIGNALS ===
    if (isVacant && isAbsentee) {
        signals.push({text:'Vacant land + absentee — carrying cost with no use',type:'positive'});
        sellerLikelihood += 12;
    } else if (isVacant) {
        signals.push({text:'Vacant land — carrying costs with no income',type:'neutral'});
        sellerLikelihood += 6;
    }
    if (landHeavy && !isVacant) {
        signals.push({text:'Land value exceeds building — possible teardown/redevelopment candidate',type:'neutral'});
        sellerLikelihood += 4;
    }
    
    // === PORTFOLIO / SIMPLIFICATION ===
    if (isSmallPortfolio) {
        signals.push({text:`Owner holds ${multiCount} properties locally — portfolio simplification possible`,type:'neutral'});
        sellerLikelihood += 5;
    }
    if (isLargePortfolio) {
        signals.push({text:`Owner holds ${multiCount}+ properties — active investor`,type:'neutral'});
        sellerLikelihood += 2;
    }
    
    // === TENURE / OWNERSHIP DURATION ===
    if (p.tenureYears !== undefined && p.tenureYears !== null) {
        if (p.tenureYears <= 1) {
            signals.push({text:`Very recent transfer (${p.lastTransferDate || '<1yr'}) — unlikely to sell`,type:'negative'});
            sellerLikelihood -= 15;
        } else if (p.tenureYears <= 2) {
            signals.push({text:`Recent buyer (~${Math.round(p.tenureYears)}yr ago) — low sell probability`,type:'negative'});
            sellerLikelihood -= 10;
        } else if (p.tenureYears <= 3) {
            signals.push({text:`Purchased ~${Math.round(p.tenureYears)}yr ago — relatively recent`,type:'negative'});
            sellerLikelihood -= 5;
        }
    } else if (p.tenureLongTerm) {
        signals.push({text:'No sale in past 3 years — ownership appears stable',type:'positive'});
        sellerLikelihood += 3;
    }
    // If no tenure data (Montana), reduce confidence slightly later
    
    // === DAMPENERS (critical — these prevent false positives) ===
    if (isOperational) {
        signals.push({text:'Active agricultural operation — lower sell probability',type:'negative'});
        sellerLikelihood -= 16;
    }
    if (isCorporateOpaque && !isAbsentee && !isOutOfState && multiCount <= 1) {
        signals.push({text:'Opaque entity with no transition signals',type:'negative'});
        sellerLikelihood -= 10;
    }
    if (isLargePortfolio && !isAbsentee) {
        sellerLikelihood -= 6; // active local investor, not disposing
    }
    // LLC alone without other signals — weak
    if (isLLC && !isTrust && !isEstate && !isHeirs && !isAbsentee && !isOutOfState && multiCount <= 1) {
        sellerLikelihood -= 5; // just an LLC, no disposition signal
    }
    
    // === HOMEOWNER BALANCING (temporary — until tenure data available) ===
    // Named individual with usable contact path gets a small boost
    const isNamedIndividual = hasCleanOwnerName && !isLLC && !isTrust && !isEstate && !isHeirs && !isRanch;
    if (isNamedIndividual && hasMailingAddr) {
        sellerLikelihood += 4;
    }
    // Anonymous entity with no human path gets additional penalty
    if (isCorporateOpaque && !hasMailingAddr) {
        sellerLikelihood -= 4;
    }
    if (isJunkName) {
        sellerLikelihood -= 3;
    }
    
    sellerLikelihood = clamp(sellerLikelihood, 0, 100);
    
    // -----------------------------------------------
    // 2. OFF-MARKET RECEPTIVITY (0-100)
    // If they sell, would they prefer discreet/direct/off-market?
    // This is the moat — entity/privacy/complexity signals belong HERE
    // -----------------------------------------------
    let offMarketReceptivity = 20;
    
    if (isTrust || isEstate || isHeirs) offMarketReceptivity += 12;
    if (isLLC) offMarketReceptivity += 10;
    if (isAbsentee) offMarketReceptivity += 10;
    if (isOutOfState) offMarketReceptivity += 8;
    if (isLuxury) offMarketReceptivity += 12;
    if (isVacant) offMarketReceptivity += 6;
    if (p.acres && p.acres > 10) offMarketReceptivity += 10;
    if (isRanch) offMarketReceptivity += 8;
    if (isHighValue) offMarketReceptivity += 4;
    if (landHeavy) offMarketReceptivity += 4;
    if (isSmallPortfolio || isLargePortfolio) offMarketReceptivity += 6;
    
    offMarketReceptivity = clamp(offMarketReceptivity, 0, 100);
    
    // -----------------------------------------------
    // 3. ACTIONABILITY (0-100)
    // Can an agent reasonably work this prospect now?
    // -----------------------------------------------
    let actionability = 25;
    
    // Contact path quality — only trust clean names
    if (hasCleanOwnerName && hasMailingAddr) actionability += 15;
    else if (hasCleanOwnerName) actionability += 8;
    else if (hasOwnerName && hasMailingAddr) actionability += 5; // name exists but suspect
    
    // Named human vs opaque entity
    if (hasCleanOwnerName && !isLLC) actionability += 12; // named individual or named trust
    if (isTrust && hasMailingAddr) actionability += 8; // named trustee pattern
    if (isHeirs || isEstate) actionability += 6; // clear transition, clear angle
    
    // Clarity of outreach
    if (isAbsentee && hasMailingAddr) actionability += 6; // clear mail path
    
    // Penalties
    if (isCorporateOpaque) actionability -= 15;
    if (isOperational) actionability -= 10;
    if (isLargePortfolio && isCorporateOpaque) actionability -= 8;
    if (!hasOwnerName) actionability -= 10;
    if (!hasMailingAddr && isCorporateOpaque) actionability -= 8;
    if (isJunkName) actionability -= 8; // junk name = can't trust identity
    
    // Homeowner balancing (temporary — until tenure data)
    if (isNamedIndividual && hasMailingAddr) actionability += 5;
    if (isCorporateOpaque && !hasMailingAddr) actionability -= 5;
    
    actionability = clamp(actionability, 0, 100);
    
    // -----------------------------------------------
    // 4. CONFIDENCE (0-100)
    // How much evidence supports these assessments?
    // -----------------------------------------------
    let confidence = 30;
    
    if (hasCleanOwnerName) confidence += 10;
    else if (hasOwnerName) confidence += 4; // name exists but questionable quality
    if (hasMailingAddr) confidence += 8;
    if (p.totalValue > 0) confidence += 6;
    if (p.propType) confidence += 4;
    if (p.acres > 0) confidence += 3;
    if (isJunkName) confidence -= 6;
    
    // Consistent signals boost confidence
    const posSignals = signals.filter(s => s.type === 'positive').length;
    const negSignals = signals.filter(s => s.type === 'negative').length;
    if (posSignals >= 3 && negSignals === 0) confidence += 10;
    else if (posSignals >= 2) confidence += 5;
    if (posSignals > 0 && negSignals > 0) confidence -= 5; // mixed signals = less certain
    
    // Thin data penalty
    if (!hasOwnerName && !hasMailingAddr) confidence -= 10;
    if (isVacant || isLuxury || isRanch) confidence -= 5; // thin comp markets = lower confidence
    
    // Tenure data quality
    if (p.tenureConfidence === 'high') confidence += 6; // exact sale date known
    else if (p.tenureLongTerm) confidence += 1; // 3yr absence = weak signal only
    else if (!p.tenureSource) confidence -= 3; // no tenure data at all (Montana)
    
    confidence = clamp(confidence, 0, 100);
    
    // -----------------------------------------------
    // BRIEFING RANK — weighted combination
    // Seller Likelihood dominates. Off-Market Receptivity refines, doesn't hijack.
    // -----------------------------------------------
    const briefingRank = Math.round(
        (sellerLikelihood * 0.50) +
        (actionability * 0.30) +
        (offMarketReceptivity * 0.15) +
        (confidence * 0.05)
    );
    
    // Score class based on briefing rank
    const scoreClass = briefingRank >= 55 ? 'high' : briefingRank >= 35 ? 'medium' : 'low';
    
    // -----------------------------------------------
    // COHORT
    // -----------------------------------------------
    let cohort = 'residential', cohortLabel = 'Residential';
    if (isHeirs || isEstate) { cohort='estate'; cohortLabel='Estate / Heir'; }
    else if (isTrust) { cohort='trust'; cohortLabel='Trust'; }
    else if (isRanch) { cohort='ranch'; cohortLabel='Ranch / Farm'; }
    else if (isLLC && !isTrust && !isEstate) { cohort='investor'; cohortLabel='Investor / Entity'; }
    else if (isAbsentee || isOutOfState) { cohort='absentee'; cohortLabel='Absentee Owner'; }
    else if (isVacant) { cohort='vacant'; cohortLabel='Vacant / Land'; }
    else if (isLuxury) { cohort='luxury'; cohortLabel='Luxury / High-End'; }
    
    return { 
        sellerLikelihood, offMarketReceptivity, actionability, confidence, briefingRank,
        scoreClass, signals, cohort, cohortLabel,
        _multiCount: multiCount, _isSmallPortfolio: isSmallPortfolio, _isLargePortfolio: isLargePortfolio,
        _isAbsentee: isAbsentee, _isOutOfState: isOutOfState, _isVacant: isVacant, _isOperational: isOperational
    };
}

// ========================
// NAME NORMALIZATION
// ========================
function normalizeName(raw) {
    if (!raw) return '';
    let n = raw.replace(/&.*$/,'').replace(/\+.*$/,'').trim(); // Remove "& SPOUSE..." or "+SPOUSE"
    if (/LLC|TRUST|INC|CORP|RANCH|FARM|ESTATE|FOUNDATION|GROUP|HOLDINGS|PROPERTIES/i.test(n)) return n.trim();
    
    const words = n.split(/\s+/).filter(w => w.length > 1);
    if (words.length < 2 || words.length > 4) return n.trim();
    
    // Only flip if ALL words are uppercase (assessor-style LAST FIRST MIDDLE)
    const allUpper = words.every(w => w === w.toUpperCase());
    if (allUpper) {
        const last = words[0];
        const first = words[1];
        const toTitle = s => s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
        return toTitle(first) + ' ' + toTitle(last);
    }
    
    // Already mixed case — return as-is with light cleanup
    return n.trim();
}

// ACTION INTELLIGENCE — turns scores into decisions
// ========================
function whyNow(p) {
    // Market signals trump everything — real listing activity
    if (p._marketSignal) {
        const ms = p._marketSignal;
        if (ms.type === 'expired_withdrawn') return 'Listing expired or withdrawn — tried to sell, needs new approach';
        if (ms.type === 'price_reduced') return 'Price reduced — may be frustrated with current strategy';
        if (ms.type === 'fsbo') return 'For sale by owner — no agent, opportunity to provide value';
        if (ms.type === 'foreclosure') return 'Pre-foreclosure or distress — time-sensitive opportunity';
        if (ms.type === 'recently_sold') return 'Recently sold — may be evaluating next move';
        return ms.text;
    }
    
    const on = (p.ownerName || '').toUpperCase();
    const tenureSuffix = p.tenureLongTerm ? ' · no sale in past 3yr' : '';
    
    // Strongest: clear transition events
    if (/\bHEIRS\b|\bDECEASED\b|\bSURVIVOR\b/.test(on)) return 'Estate/heir transition — property likely needs resolution' + tenureSuffix;
    if (/\bESTATE\b/i.test(on)) return 'Estate ownership — possible settlement or succession' + tenureSuffix;
    
    // Strong: combined signals with tenure
    if (/TRUST/i.test(on) && p._isAbsentee) return 'Trust + absentee — succession or remote management friction' + tenureSuffix;
    if (p._isAbsentee && p._isOutOfState && p._isVacant) return `Vacant land held by out-of-state absentee (${p.ownerState}) — carrying cost with no use` + tenureSuffix;
    if (p._isAbsentee && p._isOutOfState) return `Out-of-state absentee (${p.ownerState}) — distance creates management friction` + tenureSuffix;
    
    // Moderate: single strong signals
    if (p._isVacant && p._isAbsentee) return 'Vacant land + absentee owner — carrying costs with no occupancy' + tenureSuffix;
    if (/TRUST/i.test(on)) return 'Trust ownership — possible succession planning' + tenureSuffix;
    if (p._isAbsentee) return 'Absentee owner — not occupying property' + tenureSuffix;
    if (p._isOutOfState) return `Out-of-state owner (${p.ownerState}) — remote ownership friction` + tenureSuffix;
    if (p._isVacant) return 'Vacant land — carrying costs with no income' + tenureSuffix;
    
    // Long-tenure homeowner with no other strong signal — tenure IS the signal
    if (p.tenureLongTerm) return 'Not a recent buyer — ownership appears stable';
    
    // Weaker: structural signals
    if (p._multiCount >= 3) return `Portfolio owner (${p._multiCount} properties) — simplification opportunity`;
    if (p.totalValue > 500000 && p.landValue > p.totalValue * 0.6) return 'Land-heavy valuation — possible redevelopment candidate';
    if (/\bLLC\b|\bCORP\b|\bINC\b/i.test(on)) return 'Entity-owned — likely investment, numbers-driven decision';
    
    return 'Multiple minor signals elevate likelihood';
}

function contactConfidence(p) {
    let conf = 'low';
    let reason = 'Address only';
    
    const hasMailingAddr = p.ownerAddress && p.ownerAddress.length > 5;
    const on = (p.ownerName || '').toUpperCase();
    const isLLC = /\bLLC\b|\bCORP\b|\bINC\b|\bPARTNERSHIP\b|\bHOLDINGS\b|\bPROPERTIES\b|\bINVESTMENTS\b|\bGROUP\b|\bREALTY\b|\bMANAGEMENT\b/i.test(on);
    const isTrust = /\bTRUST\b/i.test(on);
    const isEstate = /\bESTATE\b|\bHEIRS\b|\bDECEASED\b/i.test(on);
    const isRanch = /\bRANCH\b|\bFARM\b/i.test(on);
    const hasName = p.ownerName && p.ownerName.length > 3;
    
    // LLCs — we don't know the person behind it
    if (isLLC && !isTrust && !isEstate && !isRanch) {
        conf = 'low';
        reason = 'Entity — principal unknown from parcel data';
        if (hasMailingAddr) { conf = 'medium'; reason = 'Entity — mailing address available, principal unknown'; }
        return { level: conf, reason };
    }
    // Trusts — often have a named person embedded (e.g., "SMITH FAMILY TRUST")
    if (isTrust && hasMailingAddr) {
        conf = 'high';
        reason = 'Named trust + mailing address';
    } else if (isTrust) {
        conf = 'medium';
        reason = 'Named trust — needs address verification';
    }
    // Estates — usually named
    else if (isEstate && hasMailingAddr) {
        conf = 'high';
        reason = 'Named estate + mailing address';
    }
    // Ranch/farm — often findable
    else if (isRanch && hasMailingAddr) {
        conf = 'high';
        reason = 'Named operation + mailing address';
    }
    // Individual with mailing address
    else if (hasName && hasMailingAddr) {
        conf = 'high';
        reason = 'Name + mailing address';
    } else if (hasName) {
        conf = 'medium';
        reason = 'Name available — needs phone lookup';
    }
    
    return { level: conf, reason };
}

function bestChannel(p) {
    const on = (p.ownerName || '').toUpperCase();
    const isEntity = /\bLLC\b|\bCORP\b|\bINC\b|\bPARTNERSHIP\b|\bHOLDINGS\b|\bPROPERTIES\b|\bINVESTMENTS\b|\bGROUP\b|\bREALTY\b|\bMANAGEMENT\b/i.test(on);
    const isTrust = /\bTRUST\b/i.test(on);
    const isEstate = /\bESTATE\b|\bHEIRS\b|\bDECEASED\b|\bSURVIVOR\b/i.test(on);
    const isRanch = /\bRANCH\b|\bFARM\b/i.test(on);
    const isAbsentee = p.mailDiffers || (p.ownerAddress && p.address && !p.ownerAddress.toLowerCase().includes(p.address.toLowerCase().substring(0,8)));
    
    // LLCs/Corps — can't call, don't know who's behind it. Letter to registered/mailing address.
    if (isEntity && !isTrust && !isEstate && !isRanch) return { channel: 'Letter to entity', icon: '✉', reason: 'Entity — send to mailing address on file' };
    // Ranches/farms — often have a business phone or local presence
    if (isRanch) return { channel: 'Phone', icon: '📞', reason: 'Agricultural operation — likely has business line' };
    // Estates/heirs — sensitive but often a named person
    if (isEstate) return { channel: 'Letter', icon: '✉', reason: 'Estate/heir — sensitive, formal written approach' };
    // Trusts with a named trustee — can be called
    if (isTrust) return { channel: 'Letter + Phone', icon: '✉📞', reason: 'Trust — letter then follow-up call to trustee' };
    // Absentee — letter to mailing address, then call
    if (isAbsentee) return { channel: 'Letter + Phone', icon: '✉📞', reason: 'Absentee — letter then follow-up call' };
    // Local owner-occupant — phone is fine
    return { channel: 'Phone', icon: '📞', reason: 'Owner-occupant — direct call' };
}

function falsePositiveRisk(p) {
    const on = (p.ownerName || '').toUpperCase();
    const risks = [];
    if (/RANCH|FARM/i.test(on) && p.acres > 20) risks.push('Active agricultural operation — may not sell');
    if (p.buildingValue > 0 && p.totalValue > 0 && p.buildingValue > p.totalValue * 0.8) risks.push('High building investment — likely committed to property');
    if (/LLC.*PROPERTIES|LLC.*INVESTMENT|LLC.*RENTAL|LLC.*CAPITAL/i.test(on)) risks.push('Investment entity name — may be acquiring, not disposing');
    if (/REALTY|REAL ESTATE|BROKERAGE|WINDERMERE|COLDWELL|KELLER\s*WILLIAMS|RE\/MAX|SOTHEBY|CENTURY\s*21|COMPASS\b/i.test(on)) risks.push('Real estate company — not a seller');
    if (/\bMANAGEMENT\s*(CO|COMPANY|GROUP|SERVICES)?\b/i.test(on) && !/TRUST|ESTATE/i.test(on)) risks.push('Property management company — likely holds as business asset');
    if (/\bDEVELOP(MENT|ER)\b|\bBUILD(ERS?|ING)\b|\bCONSTRUCTION\b/i.test(on)) risks.push('Developer/builder — likely holds for development, not sale');
    if (/\bBANK\b|\bCREDIT\s*UNION\b|\bMORTGAGE\b|\bLENDING\b/i.test(on)) risks.push('Financial institution — REO/bank-owned asset');
    if (/\bLLC\b|\bCORP\b|\bINC\b/i.test(on) && !(/TRUST|ESTATE|RANCH|FARM/i.test(on))) {
        if (p._multiCount >= 4) risks.push(`Holds ${p._multiCount}+ local properties — active investor, may not be disposing`);
    }
    return risks.length > 0 ? risks[0] : null;
}

// GEOCODE
// ========================
async function geocode(query) {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1&countrycodes=us`,{headers:{'User-Agent':'SellerSignal/1.0'}});
    const d = await r.json();
    if (d?.[0]) {
        const bb = d[0].boundingbox; // [south, north, west, east] as strings
        return { 
            lat: parseFloat(d[0].lat), lng: parseFloat(d[0].lon), 
            name: d[0].display_name,
            type: d[0].type || '',
            class: d[0].class || '',
            bbox: bb ? { south: parseFloat(bb[0]), north: parseFloat(bb[1]), west: parseFloat(bb[2]), east: parseFloat(bb[3]) } : null
        };
    }
    return null;
}

// ========================
// SHARED: TENURE ENRICHMENT
// ========================
async function enrichTenure(source, parcels) {
    if (!source.salesUrl || parcels.length === 0) return;
    document.getElementById('loadingSub').textContent = 'Checking transfer history from county sales records...';
    try {
        let bSouth=90, bNorth=-90, bWest=180, bEast=-180;
        for (const p of parcels) {
            if (p.lat < bSouth) bSouth = p.lat;
            if (p.lat > bNorth) bNorth = p.lat;
            if (p.lng < bWest) bWest = p.lng;
            if (p.lng > bEast) bEast = p.lng;
        }
        bSouth -= 0.001; bNorth += 0.001; bWest -= 0.001; bEast += 0.001;
        
        const salesSw = latlngToMerc(bSouth, bWest);
        const salesNe = latlngToMerc(bNorth, bEast);
        
        // Paginate sales queries to handle large areas
        let allSalesFeatures = [];
        let offset = 0;
        let hasMore = true;
        const maxSalesPages = 6;
        let page = 0;
        while (hasMore && page < maxSalesPages) {
            const salesParams = new URLSearchParams({
                geometry: `${salesSw.x},${salesSw.y},${salesNe.x},${salesNe.y}`,
                geometryType: 'esriGeometryEnvelope', inSR: '3857', spatialRel: 'esriSpatialRelIntersects',
                outFields: source.salesFields, returnGeometry: 'false', f: 'json',
                resultRecordCount: '2000', resultOffset: String(offset)
            });
            const salesRes = await fetch(`${source.salesUrl}?${salesParams}`);
            const salesData = await salesRes.json();
            const features = salesData.features || [];
            allSalesFeatures.push(...features);
            hasMore = salesData.exceededTransferLimit === true && features.length > 0;
            offset += 2000;
            page++;
        }
        
        if (allSalesFeatures.length) {
            const salesByPin = {};
            for (const sf of allSalesFeatures) {
                const sa = sf.attributes;
                const pin = sa.PIN;
                const saleDate = sa.SaleDate;
                if (!pin || !saleDate) continue;
                if (!salesByPin[pin] || saleDate > salesByPin[pin].saleDate) {
                    salesByPin[pin] = { saleDate, salePrice: sa.SalePrice||0, seller: (sa.Sellername||'').trim(), buyer: (sa.buyername||'').trim() };
                }
            }
            const now = Date.now();
            let enrichedCount = 0;
            for (const p of parcels) {
                const sale = salesByPin[p.id];
                if (sale) {
                    const yearsAgo = (now - sale.saleDate) / (365.25*24*60*60*1000);
                    p.lastTransferDate = new Date(sale.saleDate).toISOString().split('T')[0];
                    p.lastTransferYear = new Date(sale.saleDate).getFullYear();
                    p.tenureYears = Math.round(yearsAgo*10)/10;
                    p.tenureSource = 'king_sales3yr';
                    p.tenureConfidence = 'high';
                    p.recentTransfer = yearsAgo <= 3;
                    p.salePrice = sale.salePrice;
                    // Fill in owner name from buyer if parcel has no owner name
                    if (!p.ownerName && sale.buyer) {
                        p.ownerName = sale.buyer.replace(/\+/g,' ').replace(/\s+/g,' ').trim();
                        p.ownerNameSource = 'county_sales';
                    }
                    enrichedCount++;
                } else {
                    p.tenureYears = null;
                    p.tenureLongTerm = true;
                    p.tenureSource = 'king_sales3yr_absence';
                    p.tenureConfidence = 'medium';
                    p.recentTransfer = false;
                }
            }
            console.log(`Tenure: ${enrichedCount} recent sales, ${parcels.length-enrichedCount} stable owners`);
        }
    } catch(e) { console.log('Tenure fetch failed:', e.message); }
}

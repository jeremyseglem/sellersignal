<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SellerSignal — Claim Your Territory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB4m-NdYD6t_3AVdy23i8up5CE0yo9uT0o&libraries=marker"></script>
<style>
:root{
    --bg:#F5F0EB;--bg-card:#FFFFFF;--bg-card-hover:#FAF7F3;--bg-elevated:#EDE7DF;
    --text:#2C2418;--text-secondary:#7A6E5D;--text-dim:#A89B8A;
    --gold:#8B6914;--gold-dim:rgba(139,105,20,0.06);--gold-border:rgba(139,105,20,0.18);--accent:#8B6914;
    --green:#5A7247;--green-dim:rgba(90,114,71,0.08);--green-border:rgba(90,114,71,0.20);
    --red:#9E4B3C;--red-dim:rgba(158,75,60,0.06);
    --border:#D9CEBF;--border-light:#E8E0D4;
    --radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
::selection{background:#2C2418;color:#F5F0EB}
.header{padding:20px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.logo-mark{width:28px;height:28px;border:2px solid #F5F0EB;border-radius:50%;display:flex;align-items:flex-end;justify-content:center;gap:2px;padding-bottom:6px}
.logo-mark .bar{width:2.5px;background:#F5F0EB;border-radius:1px}
.logo-mark .bar:nth-child(1){height:4px}.logo-mark .bar:nth-child(2){height:7px}.logo-mark .bar:nth-child(3){height:11px}
.logo-text{font-family:"DM Serif Display",serif;font-size:18px;color:#F5F0EB}
.header-nav{display:flex;gap:20px;align-items:center}
.header-nav a{font-size:12px;color:var(--text-dim);text-decoration:none;font-weight:500;letter-spacing:0.03em;transition:color 0.2s}
.header-nav a:hover{color:var(--gold)}.header-nav a.active{color:var(--gold)}
.main{display:flex;height:calc(100vh - 61px)}
.map-area{flex:1;position:relative;display:flex;flex-direction:column}
.map-header{padding:24px 32px 16px;display:flex;align-items:flex-end;justify-content:space-between}
.map-header h1{font-family:'DM Serif Display',serif;font-size:28px;color:var(--text)}
.map-header p{font-size:12px;color:var(--text-secondary);font-weight:400}
.map-header p strong{color:var(--gold);font-weight:600}
#mapCanvas{flex:1;border-top:1px solid var(--border)}
.side-panel{width:400px;background:var(--bg-card);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.panel-empty{display:flex;align-items:center;justify-content:center;flex:1;text-align:center;padding:40px}
.panel-empty h2{font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:10px;color:var(--text)}
.panel-empty p{font-size:13px;color:var(--text-dim);line-height:1.6;max-width:260px;margin:0 auto}
.stats-row{margin-top:24px;display:flex;gap:20px;justify-content:center}
.stat{text-align:center}.stat-val{font-size:22px;font-weight:700;color:var(--gold)}
.stat-label{font-size:10px;color:var(--text-dim);font-weight:500;letter-spacing:0.05em;margin-top:2px}
.panel-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.back-btn{padding:5px 10px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text-dim);font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.2s}
.back-btn:hover{border-color:var(--gold);color:var(--gold)}
.panel-header h3{font-family:'DM Serif Display',serif;font-size:17px;flex:1}
.panel-header .avail{font-size:11px;color:var(--green);font-weight:500}
.zip-list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.zip-card{padding:13px 16px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);display:flex;align-items:center;gap:14px;cursor:pointer;transition:all 0.2s}
.zip-card:hover{border-color:var(--gold-border);background:var(--gold-dim)}
.zip-card.claimed{opacity:0.3;cursor:not-allowed}.zip-card.claimed:hover{border-color:var(--border);background:var(--bg-elevated)}
.zip-card.selected{border-color:var(--gold);background:var(--gold-dim)}
.zip-code{font-size:15px;font-weight:700;color:var(--gold);min-width:48px;font-variant-numeric:tabular-nums}
.zip-card.claimed .zip-code{color:var(--text-dim)}.zip-info{flex:1}
.zip-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:1px}
.zip-meta{font-size:11px;color:var(--text-dim)}
.zip-badge{font-size:9px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.zip-badge.available{color:var(--green);background:var(--green-dim)}
.zip-badge.claimed{color:var(--text-dim);background:rgba(255,255,255,0.03)}
.zip-badge.selected{color:var(--gold);background:var(--gold-dim)}
.cart{border-top:1px solid var(--border);padding:18px 20px;background:var(--bg)}
.cart-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cart-count{font-size:12px;color:var(--text-secondary)}
.cart-total{font-size:22px;font-weight:700;color:var(--gold)}.cart-total span{font-size:12px;color:var(--text-dim);font-weight:400}
.claim-btn{width:100%;padding:14px;background:#2C2418;color:#F5F0EB;border:none;border-radius:var(--radius);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s;opacity:0.25;pointer-events:none;letter-spacing:0.02em}
.claim-btn.active{opacity:1;pointer-events:auto}
.claim-btn.active:hover{background:#d4b88c;transform:translateY(-1px);box-shadow:0 6px 24px var(--gold-border)}
</style>
</head>
<body>
<div class="header">
    <a href="index.html" class="logo">
        <div class="logo-mark"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        <div class="logo-text">SellerSignal</div>
    </a>
    <div class="header-nav">
        <a href="sellersignal-markets.html" class="active">Markets</a>
        <a href="sellersignal-briefing.html">Briefing</a>
        <a href="sellersignal-crm.html">Pipeline</a>
    </div>
</div>
<div class="main">
    <div class="map-area">
        <div class="map-header">
            <h1>Claim Your Territory</h1>
            <p>Each ZIP is <strong>exclusive to one agent</strong> — $1,000/month per territory</p>
        </div>
        <div id="mapCanvas"></div>
    </div>
    <div class="side-panel">
        <div class="panel-empty" id="panelEmpty"><div>
            <h2>Select a Market</h2>
            <p>Click a region on the map to view available ZIP codes</p>
            <div class="stats-row">
                <div class="stat"><div class="stat-val">9</div><div class="stat-label">Markets</div></div>
                <div class="stat"><div class="stat-val">85+</div><div class="stat-label">ZIP Codes</div></div>
                <div class="stat"><div class="stat-val">$1K</div><div class="stat-label">Per ZIP/Mo</div></div>
            </div>
        </div></div>
        <div id="panelContent" style="display:none;flex-direction:column;flex:1">
            <div class="panel-header">
                <button class="back-btn" onclick="clearMarket()">&#8592;</button>
                <h3 id="marketName"></h3>
                <div class="avail" id="marketAvail"></div>
            </div>
            <div class="zip-list" id="zipList"></div>
        </div>
        <div class="cart">
            <div class="cart-row">
                <div class="cart-count" id="cartCount">0 territories selected</div>
                <div class="cart-total" id="cartTotal">$0<span>/mo</span></div>
            </div>
            <button class="claim-btn" id="claimBtn" onclick="claimTerritories()">Claim Territory</button>
        </div>
    </div>
</div>
<script>
const MARKETS={
    MT:{name:'Montana',lat:45.677,lng:-111.043,zoom:8,zips:[{code:'59718',name:'Bozeman',parcels:595},{code:'59715',name:'Bozeman S',parcels:480},{code:'59716',name:'Big Sky',parcels:2155},{code:'59730',name:'Gallatin Gateway',parcels:320},{code:'59714',name:'Belgrade',parcels:410},{code:'59711',name:'Anaconda',parcels:280}]},
    WA_KING:{name:'King County, WA',lat:47.606,lng:-122.332,zoom:10,zips:[{code:'98112',name:'Capitol Hill',parcels:3200},{code:'98004',name:'Bellevue',parcels:4100},{code:'98033',name:'Kirkland',parcels:3800},{code:'98040',name:'Mercer Island',parcels:2900},{code:'98039',name:'Medina',parcels:850},{code:'98074',name:'Sammamish',parcels:4500},{code:'98103',name:'Fremont',parcels:3600},{code:'98109',name:'Queen Anne',parcels:2200},{code:'98105',name:'U District',parcels:2800},{code:'98199',name:'Magnolia',parcels:2100}]},
    OR_DESCHUTES:{name:'Bend, OR',lat:44.058,lng:-121.315,zoom:10,zips:[{code:'97701',name:'Bend Central',parcels:2800},{code:'97702',name:'Bend SW',parcels:3200},{code:'97703',name:'Bend W / Tumalo',parcels:1800},{code:'97707',name:'Sunriver',parcels:2400},{code:'97756',name:'Redmond',parcels:3100},{code:'97759',name:'Sisters',parcels:1200}]},
    AZ_MARICOPA:{name:'Phoenix / Scottsdale, AZ',lat:33.494,lng:-111.926,zoom:10,zips:[{code:'85253',name:'Paradise Valley',parcels:4200},{code:'85254',name:'N Scottsdale',parcels:6800},{code:'85262',name:'Scottsdale Ranch',parcels:5100},{code:'85255',name:'DC Ranch',parcels:7200},{code:'85268',name:'Fountain Hills',parcels:4800},{code:'85331',name:'Cave Creek',parcels:3900},{code:'85251',name:'Old Town Scottsdale',parcels:12000},{code:'85258',name:'S Scottsdale',parcels:5500},{code:'85260',name:'N Scottsdale',parcels:6200},{code:'85281',name:'Tempe',parcels:8400},{code:'85224',name:'Chandler',parcels:7100},{code:'85295',name:'Gilbert',parcels:6600},{code:'85206',name:'Mesa',parcels:5800}]},
    TX_SA:{name:'San Antonio, TX',lat:29.424,lng:-98.494,zoom:11,zips:[{code:'78209',name:'Alamo Heights',parcels:3400},{code:'78255',name:'Stone Oak',parcels:4200},{code:'78258',name:'N San Antonio',parcels:5100},{code:'78230',name:'Medical Center',parcels:3800}]},
    NC:{name:'North Carolina',lat:35.460,lng:-80.500,zoom:7,zips:[{code:'28202',name:'Uptown Charlotte',parcels:2100},{code:'28207',name:'Elizabeth',parcels:4533},{code:'28209',name:'Myers Park',parcels:5200},{code:'28211',name:'SouthPark',parcels:4800},{code:'28226',name:'Ballantyne',parcels:6100},{code:'28277',name:'Ballantyne W',parcels:5400},{code:'28270',name:'Providence',parcels:4900},{code:'28105',name:'Matthews',parcels:3600},{code:'27609',name:'N Raleigh',parcels:4100},{code:'27615',name:'N Hills',parcels:3800},{code:'27613',name:'W Raleigh',parcels:4300},{code:'27517',name:'Chapel Hill',parcels:2900},{code:'27707',name:'Durham',parcels:3200},{code:'28803',name:'S Asheville',parcels:2800},{code:'28804',name:'N Asheville',parcels:2600},{code:'28401',name:'Wilmington',parcels:3100}]},
    NY:{name:'New York',lat:40.95,lng:-73.85,zoom:8,zips:[{code:'10021',name:'Upper East Side',parcels:4800},{code:'10024',name:'Upper West Side',parcels:4200},{code:'10014',name:'West Village',parcels:2900},{code:'10013',name:'Tribeca',parcels:2100},{code:'11201',name:'Brooklyn Heights',parcels:3600},{code:'10583',name:'Scarsdale',parcels:2800},{code:'10504',name:'Armonk',parcels:1900},{code:'11937',name:'East Hampton',parcels:3200},{code:'11976',name:'Water Mill',parcels:1400},{code:'12866',name:'Saratoga',parcels:2600}]},
    FL_PB:{name:'Palm Beach County, FL',lat:26.715,lng:-80.053,zoom:10,zips:[{code:'33480',name:'Palm Beach',parcels:4100},{code:'33486',name:'Boca Raton',parcels:8343},{code:'33496',name:'Boca W',parcels:6200},{code:'33432',name:'Boca E',parcels:4800},{code:'33433',name:'Boca S',parcels:5100},{code:'33487',name:'Boca Beach',parcels:3200},{code:'33458',name:'Jupiter',parcels:5800},{code:'33408',name:'N Palm Beach',parcels:3400},{code:'33462',name:'Lantana',parcels:2900},{code:'33434',name:'W Boca',parcels:4600}]},
    FL_MD:{name:'Miami-Dade County, FL',lat:25.762,lng:-80.192,zoom:11,zips:[{code:'33139',name:'Miami Beach',parcels:3087},{code:'33140',name:'N Miami Beach',parcels:2800},{code:'33131',name:'Brickell',parcels:4200},{code:'33133',name:'Coconut Grove',parcels:8284},{code:'33134',name:'Coral Gables',parcels:10206},{code:'33149',name:'Key Biscayne',parcels:1627},{code:'33156',name:'Pinecrest',parcels:4800},{code:'33143',name:'South Miami',parcels:3600}]}
};

const CLAIMED=new Set(['98004','85253','10021','33480','28209']);
let selected=new Set(), activeMarket=null, map=null, markers=[];

const DARK_STYLE = [
    {elementType:'geometry',stylers:[{color:'#EDE7DF'}]},
    {elementType:'labels.text.stroke',stylers:[{color:'#EDE7DF'}]},
    {elementType:'labels.text.fill',stylers:[{color:'#4a5768'}]},
    {featureType:'administrative',elementType:'geometry.stroke',stylers:[{color:'#172030'}]},
    {featureType:'road',elementType:'geometry',stylers:[{color:'#172030'}]},
    {featureType:'road',elementType:'labels',stylers:[{visibility:'off'}]},
    {featureType:'water',elementType:'geometry',stylers:[{color:'#C8D8D8'}]},
    {featureType:'water',elementType:'labels',stylers:[{visibility:'off'}]},
    {featureType:'poi',stylers:[{visibility:'off'}]},
    {featureType:'transit',stylers:[{visibility:'off'}]},
    {featureType:'road.highway',elementType:'geometry',stylers:[{color:'#1e2d3d'}]},
    {featureType:'landscape',elementType:'geometry',stylers:[{color:'#E8E0D4'}]},
];

function initMap() {
    map = new google.maps.Map(document.getElementById('mapCanvas'), {
        center: { lat: 38.5, lng: -96 },
        zoom: 4,
        styles: DARK_STYLE,
        disableDefaultUI: true,
        zoomControl: true,
        zoomControlOptions: { position: google.maps.ControlPosition.RIGHT_CENTER },
        backgroundColor: '#F5F0EB',
        gestureHandling: 'greedy',
    });

    // Add market markers
    for (const [key, m] of Object.entries(MARKETS)) {
        const marker = new google.maps.Marker({
            position: { lat: m.lat, lng: m.lng },
            map: map,
            title: m.name,
            icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 10,
                fillColor: '#8B6914',
                fillOpacity: 0.9,
                strokeColor: '#8B6914',
                strokeWeight: 2,
                strokeOpacity: 0.3,
            },
        });

        // Label
        const label = new google.maps.InfoWindow({
            content: '<div style="font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;color:#2C2418;padding:2px 4px">' + m.name + '</div>',
            disableAutoPan: true,
        });

        marker.addListener('mouseover', () => label.open(map, marker));
        marker.addListener('mouseout', () => label.close());
        marker.addListener('click', () => {
            selectMarket(key);
            map.panTo({ lat: m.lat, lng: m.lng });
            map.setZoom(m.zoom);
        });
        markers.push({ key, marker, label });
    }
}

function selectMarket(key) {
    // Update marker colors
    markers.forEach(m => {
        m.marker.setIcon({
            path: google.maps.SymbolPath.CIRCLE,
            scale: m.key === key ? 12 : 8,
            fillColor: m.key === key ? '#5A7247' : '#8B6914',
            fillOpacity: m.key === key ? 1 : 0.7,
            strokeColor: m.key === key ? '#5A7247' : '#8B6914',
            strokeWeight: 2, strokeOpacity: 0.3,
        });
    });

    activeMarket = key;
    const m = MARKETS[key];
    document.getElementById('panelEmpty').style.display = 'none';
    document.getElementById('panelContent').style.display = 'flex';
    document.getElementById('marketName').textContent = m.name;
    const av = m.zips.filter(z => !CLAIMED.has(z.code)).length;
    document.getElementById('marketAvail').textContent = av + ' of ' + m.zips.length + ' available';
    document.getElementById('zipList').innerHTML = m.zips.map(z => {
        const cl = CLAIMED.has(z.code), sel = selected.has(z.code);
        return '<div class="zip-card ' + (cl?'claimed':sel?'selected':'') + '" onclick="' + (cl?'':'toggleZip(\''+z.code+'\')') + '"><div class="zip-code">' + z.code + '</div><div class="zip-info"><div class="zip-name">' + z.name + '</div><div class="zip-meta">' + z.parcels.toLocaleString() + ' parcels</div></div><div class="zip-badge ' + (cl?'claimed':sel?'selected':'available') + '">' + (cl?'Claimed':sel?'Selected':'Available') + '</div></div>';
    }).join('');
}

function clearMarket() {
    activeMarket = null;
    markers.forEach(m => m.marker.setIcon({
        path: google.maps.SymbolPath.CIRCLE, scale: 10,
        fillColor: '#8B6914', fillOpacity: 0.9, strokeColor: '#8B6914', strokeWeight: 2, strokeOpacity: 0.3,
    }));
    document.getElementById('panelEmpty').style.display = 'flex';
    document.getElementById('panelContent').style.display = 'none';
    map.panTo({ lat: 38.5, lng: -96 });
    map.setZoom(4);
}

function toggleZip(code) {
    if (CLAIMED.has(code)) return;
    if (selected.has(code)) selected.delete(code); else selected.add(code);
    if (activeMarket) selectMarket(activeMarket);
    updateCart();
}

function updateCart() {
    const n = selected.size;
    document.getElementById('cartCount').textContent = n + ' territor' + (n !== 1 ? 'ies' : 'y') + ' selected';
    document.getElementById('cartTotal').innerHTML = '$' + (n * 1000).toLocaleString() + '<span>/mo</span>';
    document.getElementById('claimBtn').classList.toggle('active', n > 0);
}

function claimTerritories() {
    if (!selected.size) return;
    alert('Claiming ' + selected.size + ' territories: ' + Array.from(selected).join(', ') + '\n\nTotal: $' + (selected.size * 1000).toLocaleString() + '/month');
}

updateCart();
window.addEventListener('load', initMap);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SellerSignal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#0a0f14;--bg-card:#111921;--bg-card-hover:#162430;--bg-input:#1a2a3a;--text:#FDFCFA;--text-secondary:#8a9aa8;--text-tertiary:#5a6a78;--accent:#c4a87c;--accent-hover:#d4b88c;--border:#1e2a36;--score-high:#4ade80;--score-medium:#fbbf24;--score-low:#f87171}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{padding:12px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--bg);z-index:1000;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none}
.logo-mark{width:28px;height:28px;border:2px solid var(--text);border-radius:50%;display:flex;align-items:flex-end;justify-content:center;gap:2px;padding-bottom:6px}
.logo-mark .bar{width:2.5px;background:var(--text);border-radius:1px}
.logo-mark .bar:nth-child(1){height:4px}.logo-mark .bar:nth-child(2){height:7px}.logo-mark .bar:nth-child(3){height:11px}
.logo-text{font-family:'DM Serif Display',serif;font-size:18px}
.header-right{display:flex;align-items:center;gap:12px}
.state-badge{padding:5px 12px;background:rgba(196,168,124,0.12);border:1px solid rgba(196,168,124,0.25);border-radius:6px;font-size:11px;font-weight:600;color:var(--accent);letter-spacing:0.05em}
.usage-badge{font-size:12px;color:var(--text-secondary);padding:5px 10px;background:var(--bg-card);border-radius:6px}
.usage-badge strong{color:var(--accent)}
.map-container{flex:1;position:relative}
#map{width:100%;height:100%}
.leaflet-container{background:#0a0f14}
.leaflet-control-zoom a{background:var(--bg-card)!important;color:var(--text)!important;border-color:var(--border)!important}
.leaflet-control-zoom a:hover{background:var(--bg-card-hover)!important}
.leaflet-control-attribution{background:rgba(10,15,20,0.8)!important;color:var(--text-tertiary)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--text-secondary)!important}
.leaflet-popup-content-wrapper{background:var(--bg-card)!important;border:1px solid var(--border)!important;border-radius:10px!important;box-shadow:0 8px 32px rgba(0,0,0,0.6)!important;padding:0!important}
.leaflet-popup-content{margin:0!important;width:320px!important;font-family:'Inter',sans-serif!important}
.popup-photo{width:100%;height:140px;background:var(--bg);position:relative;overflow:hidden}
.popup-photo img{width:100%;height:100%;object-fit:cover;display:block}
.popup-photo-score{position:absolute;top:10px;right:10px;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;backdrop-filter:blur(8px);border:2px solid rgba(0,0,0,0.3)}
.popup-photo-score.high{color:#fff;background:rgba(74,222,128,0.85)}
.popup-photo-score.medium{color:#fff;background:rgba(251,191,36,0.85)}
.popup-photo-score.low{color:#fff;background:rgba(248,113,113,0.85)}
.popup-photo-label{position:absolute;bottom:0;left:0;right:0;padding:6px 12px;background:linear-gradient(transparent,rgba(0,0,0,0.7));font-size:10px;color:rgba(255,255,255,0.7);text-align:right}
.leaflet-popup-tip{background:var(--bg-card)!important;border:1px solid var(--border)!important;box-shadow:none!important}
.leaflet-popup-close-button{color:var(--text-tertiary)!important;font-size:18px!important;top:8px!important;right:10px!important}
.search-overlay{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:900;width:480px;max-width:calc(100% - 32px)}
.search-box{display:flex;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.search-box input{flex:1;padding:14px 18px;background:transparent;border:none;color:var(--text);font-size:14px;font-family:inherit;outline:none}
.search-box input::placeholder{color:var(--text-tertiary)}
.search-box button{padding:14px 20px;background:var(--accent);border:none;color:var(--bg);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.search-box button:hover{background:var(--accent-hover)}
.quick-jumps{display:flex;gap:6px;margin-top:8px;justify-content:center;flex-wrap:wrap}
.quick-jump{padding:6px 14px;background:rgba(17,25,33,0.9);border:1px solid var(--border);border-radius:20px;color:var(--text-secondary);font-size:11px;cursor:pointer;transition:all 0.2s;backdrop-filter:blur(8px)}
.quick-jump:hover{border-color:var(--accent);color:var(--accent)}
.popup-card{padding:16px}.popup-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.popup-owner{font-weight:600;font-size:14px;color:var(--text);max-width:210px;line-height:1.3}
.popup-redacted{font-size:11px;color:var(--accent);font-weight:500;margin-top:4px;display:flex;align-items:center;gap:4px}
.popup-type{font-size:10px;font-weight:500;letter-spacing:0.05em;text-transform:uppercase;color:var(--text-tertiary);margin-top:3px}
.popup-score{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0}
.popup-score.high{color:var(--score-high);background:rgba(74,222,128,0.12);border:1.5px solid rgba(74,222,128,0.3)}
.popup-score.medium{color:var(--score-medium);background:rgba(251,191,36,0.12);border:1.5px solid rgba(251,191,36,0.3)}
.popup-score.low{color:var(--score-low);background:rgba(248,113,113,0.12);border:1.5px solid rgba(248,113,113,0.3)}
.popup-address{font-size:12px;color:var(--text-secondary);margin-bottom:12px}
.popup-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.popup-metric-label{font-size:9px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-tertiary)}
.popup-metric-value{font-size:13px;font-weight:600;color:var(--accent)}.popup-metric-value.plain{color:var(--text)}
.popup-signals{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px}
.popup-signal{font-size:10px;padding:3px 8px;border-radius:3px;background:rgba(196,168,124,0.1);color:var(--accent);border:1px solid rgba(196,168,124,0.2)}
.popup-deep-btn{width:100%;padding:10px;background:transparent;border:1.5px solid var(--accent);border-radius:6px;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.2s}
.popup-deep-btn:hover{background:var(--accent);color:var(--bg)}
.stats-bar{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:900;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:10px 20px;display:none;gap:24px;align-items:center;box-shadow:0 8px 32px rgba(0,0,0,0.5);font-size:12px}
.stat-item{display:flex;align-items:center;gap:6px;color:var(--text-secondary)}
.stat-dot{width:8px;height:8px;border-radius:50%}.stat-dot.high{background:var(--score-high)}.stat-dot.medium{background:var(--score-medium)}.stat-dot.low{background:var(--score-low)}
.stat-count{font-weight:700;color:var(--text)}
.zoom-message{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:800;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:20px 32px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.zoom-message p{color:var(--text-secondary);font-size:14px}.zoom-message .hint{color:var(--text-tertiary);font-size:12px;margin-top:6px}
.map-loading{display:none;position:absolute;top:12px;right:16px;z-index:900;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:12px;color:var(--accent);box-shadow:0 4px 16px rgba(0,0,0,0.4)}
.map-loading.active{display:flex;align-items:center;gap:8px}
.mini-spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Deep Signal Overlay */
.deep-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:2000;overflow-y:auto}
.deep-overlay.active{display:block}
.deep-header{padding:12px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);z-index:10}
.deep-back{padding:8px 16px;background:transparent;border:1px solid var(--accent);border-radius:6px;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.deep-back:hover{background:var(--accent);color:var(--bg)}
.deep-body{max-width:900px;margin:0 auto;padding:32px 24px}
.deep-loading{text-align:center;padding:80px 24px}
.deep-spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
.deep-loading p{color:var(--text-secondary);font-size:15px}
.deep-loading .substep{color:var(--text-tertiary);font-size:12px;margin-top:8px}
.deep-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.deep-card-header{padding:24px;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--border)}
.deep-card-name{font-family:'DM Serif Display',serif;font-size:28px;margin-bottom:4px}
.deep-card-addr{font-size:14px;color:var(--text-secondary)}
.deep-score-big{font-size:48px;font-weight:600;line-height:1}
.deep-score-big.high{color:var(--score-high)}.deep-score-big.medium{color:var(--score-medium)}.deep-score-big.low{color:var(--score-low)}
.deep-score-label{font-size:11px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;margin-top:4px;text-align:right}
.deep-metrics{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--border)}
.deep-metric{padding:20px;border-right:1px solid var(--border)}
.deep-metric:last-child{border-right:none}
.deep-metric-label{font-size:10px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:4px}
.deep-metric-val{font-size:18px;font-weight:600}
.deep-metric-val.gold{color:var(--accent)}
.deep-grid{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--border)}
.deep-block{padding:24px;border-right:1px solid var(--border)}
.deep-block:nth-child(2n){border-right:none}
.deep-block h4{font-size:11px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.deep-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px}
.deep-row-label{color:var(--text-tertiary)}
.deep-row-value{color:var(--text);text-align:right;max-width:60%}
.deep-tick{padding:24px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,rgba(196,168,124,0.05) 0%,transparent 100%)}
.deep-tick h4{font-size:11px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.deep-tick-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.deep-tick-label{font-size:10px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:var(--accent)}
.deep-tick-value{font-size:13px;color:var(--text-secondary);line-height:1.5}
.deep-signals{padding:24px;border-bottom:1px solid var(--border)}
.deep-signals-header{display:flex;justify-content:space-between;margin-bottom:16px}
.deep-signals-header h4{font-size:11px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-tertiary)}
.deep-signal-tags{display:flex;flex-wrap:wrap;gap:8px}
.deep-signal-tag{padding:8px 12px;background:var(--bg);font-size:12px;color:var(--text-secondary);border-left:3px solid var(--score-medium)}
.deep-signal-tag.positive{border-left-color:var(--score-high)}.deep-signal-tag.negative{border-left-color:var(--score-low)}
.deep-approach{padding:24px;border-bottom:1px solid var(--border)}
.deep-approach h4{font-size:11px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:16px}
.deep-approach-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.deep-approach-block{padding:16px;background:var(--bg);border-radius:8px}
.deep-approach-block h5{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:8px}
.deep-approach-block p{font-size:13px;color:var(--text-secondary);line-height:1.5}
.deep-scripts{padding:24px}
.deep-scripts h4{font-size:11px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:16px}
.deep-script-tabs{display:flex;gap:8px;margin-bottom:16px}
.deep-script-tab{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:13px;color:var(--text-secondary);cursor:pointer;font-family:inherit}
.deep-script-tab.active{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.deep-script-content{display:none;padding:20px;background:var(--bg);border-radius:8px;font-size:13px;color:var(--text-secondary);line-height:1.7;white-space:pre-wrap}
.deep-script-content.active{display:block}
@media(max-width:768px){.deep-metrics{grid-template-columns:1fr 1fr}.deep-grid{grid-template-columns:1fr}.deep-tick-grid{grid-template-columns:1fr}.deep-approach-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header">
    <a class="logo"><div class="logo-mark"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div><span class="logo-text">SellerSignal</span></a>
    <div class="header-right">
        <div class="state-badge" id="stateBadge">LOADING...</div>
        <div class="usage-badge"><strong>47</strong> signals remaining</div>
    </div>
</header>
<div class="map-container">
    <div class="search-overlay">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search any address...">
            <button onclick="flyToSearch()">Go</button>
        </div>
        <div class="quick-jumps">
            <button class="quick-jump" onclick="flyTo(47.6255,-122.3196,'Capitol Hill, Seattle')">Capitol Hill</button>
            <button class="quick-jump" onclick="flyTo(47.6298,-122.3570,'Queen Anne, Seattle')">Queen Anne</button>
            <button class="quick-jump" onclick="flyTo(47.6688,-122.3840,'Ballard, Seattle')">Ballard</button>
            <button class="quick-jump" onclick="flyTo(47.5530,-122.2700,'Mercer Island')">Mercer Island</button>
            <button class="quick-jump" onclick="flyTo(45.6770,-111.0429,'Bozeman, MT')">Bozeman</button>
            <button class="quick-jump" onclick="flyTo(45.6833,-111.0553,'S Willson, Bozeman')">S Willson</button>
        </div>
    </div>
    <div class="map-loading" id="mapLoading"><div class="mini-spinner"></div><span id="loadingText">Loading parcels...</span></div>
    <div class="zoom-message" id="zoomMessage"><p>Zoom in to see seller signals</p><div class="hint">Parcel data loads at street level</div></div>
    <div id="map"></div>
    <div class="stats-bar" id="statsBar">
        <div class="stat-item"><div class="stat-dot high"></div> High <span class="stat-count" id="countHigh">0</span></div>
        <div class="stat-item"><div class="stat-dot medium"></div> Medium <span class="stat-count" id="countMed">0</span></div>
        <div class="stat-item"><div class="stat-dot low"></div> Low <span class="stat-count" id="countLow">0</span></div>
        <div class="stat-item" style="color:var(--text-tertiary)">|</div>
        <div class="stat-item"><span class="stat-count" id="countTotal">0</span> properties in view</div>
    </div>
</div>
<!-- Deep Signal Overlay -->
<div class="deep-overlay" id="deepOverlay">
    <div class="deep-header">
        <a class="logo"><div class="logo-mark"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div><span class="logo-text">SellerSignal</span></a>
        <button class="deep-back" onclick="closeDeep()">← Back to Map</button>
    </div>
    <div class="deep-body" id="deepBody"></div>
</div>

<script>
// ========================
// DATA SOURCES
// ========================
const SOURCES={
MT:{name:'Montana',url:'https://gisservicemt.gov/arcgis/rest/services/MSDI_Framework/Parcels/MapServer/0/query',
fields:'OwnerName,AddressLine1,CityStateZip,TotalValue,TotalBuildingValue,TotalLandValue,PropType,GISAcres,Subdivision,OwnerAddress1,OwnerCity,OwnerState,OwnerZipCode,PARCELID',
max:2000,bounds:{south:44.35,north:49.0,west:-116.05,east:-104.04},
parse(f){const a=f.attributes;let lat=0,lng=0;if(f.centroid){lng=f.centroid.x;lat=f.centroid.y}else if(f.geometry?.rings?.[0]?.length){const r=f.geometry.rings[0];lng=r.reduce((s,p)=>s+p[0],0)/r.length;lat=r.reduce((s,p)=>s+p[1],0)/r.length}
return{id:a.PARCELID,ownerName:a.OwnerName||'',address:(a.AddressLine1||'').trim(),cityStateZip:(a.CityStateZip||'').trim(),totalValue:a.TotalValue||0,buildingValue:a.TotalBuildingValue||0,landValue:a.TotalLandValue||0,propType:a.PropType||'',acres:a.GISAcres||0,subdivision:a.Subdivision||'',ownerAddress:(a.OwnerAddress1||'').trim(),ownerState:(a.OwnerState||'').trim(),exempt:a.PropType==='Exempt Property',lat,lng,hasOwnerName:!!a.OwnerName,ownerRevealed:true}}},
WA_KING:{name:'Washington — King County',url:'https://services.arcgis.com/Ej0PsM5Aw677QF1W/arcgis/rest/services/PARCEL_ADDRESS_PUB_AREA_3069/FeatureServer/0/query',
fields:'PAAUNIQUENAME,KCTP_ATTN,ADDR_FULL,CTYNAME,KCTP_ADDR,KCTP_CTYST,KCTP_STATE,APPRLNDVAL,APPR_IMPR,TAX_LNDVAL,TAX_IMPR,PLAT_NAME,KCA_ACRES,PREUSE_DESC,PIN,LAT,LON',
max:2000,bounds:{south:47.0,north:47.8,west:-122.6,east:-121.0},
parse(f){const a=f.attributes;const owner=(a.PAAUNIQUENAME||a.KCTP_ATTN||'').trim();const lv=a.APPRLNDVAL||a.TAX_LNDVAL||0;const bv=a.APPR_IMPR||a.TAX_IMPR||0;
let lat=a.LAT||0,lng=a.LON||0;if((!lat||!lng)&&f.centroid){lng=f.centroid.x;lat=f.centroid.y}else if((!lat||!lng)&&f.geometry?.rings?.[0]?.length){const r=f.geometry.rings[0];lng=r.reduce((s,p)=>s+p[0],0)/r.length;lat=r.reduce((s,p)=>s+p[1],0)/r.length}
const site=(a.ADDR_FULL||'').toLowerCase();const mail=(a.KCTP_ADDR||'').toLowerCase();
const mailDiff=mail&&site&&site.length>5&&!mail.includes(site.substring(0,Math.min(8,site.length)));
const isEntity=owner&&/LLC|TRUST|CORP|INC|FOUNDATION|GROUP|PARTNERS|ASSOC/i.test(owner);
return{id:a.PIN,ownerName:isEntity?owner:'',address:(a.ADDR_FULL||'').trim(),cityStateZip:`${a.CTYNAME||'Seattle'}, WA`,totalValue:lv+bv,buildingValue:bv,landValue:lv,propType:(a.PREUSE_DESC||'').trim(),acres:a.KCA_ACRES||0,subdivision:(a.PLAT_NAME||'').trim(),ownerAddress:mail,ownerState:(a.KCTP_STATE||'').trim(),exempt:/exempt|government/i.test(a.PREUSE_DESC||''),lat,lng,hasOwnerName:isEntity,ownerRevealed:isEntity,mailDiffers:mailDiff}}}
};

function getSource(lat,lng){for(const[k,s]of Object.entries(SOURCES)){const b=s.bounds;if(lat>=b.south&&lat<=b.north&&lng>=b.west&&lng<=b.east)return{key:k,source:s}}return null}

// ========================
// MAP
// ========================
const map=L.map('map',{center:[47.6255,-122.3196],zoom:16});
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OSM &copy; CARTO',subdomains:'abcd',maxZoom:20}).addTo(map);
let markers=[],isLoading=false;const MIN_ZOOM=15;
const colors={high:'#4ade80',medium:'#fbbf24',low:'#f87171'};
const glows={high:'rgba(74,222,128,0.4)',medium:'rgba(251,191,36,0.3)',low:'rgba(248,113,113,0.2)'};

// ========================
// SCORING
// ========================
function scoreParcel(p,all){
    const signals=[];let score=35;if(p.exempt)return{score:0,scoreClass:'low',signals:[]};
    const pa=(p.address||'').toLowerCase().replace(/\s+/g,'');const oa=(p.ownerAddress||'').toLowerCase().replace(/\s+/g,'');
    if(p.mailDiffers||(oa&&pa&&pa.length>5&&!oa.includes(pa.substring(0,Math.min(10,pa.length))))){
        if(p.ownerState&&!['MT','WA'].includes(p.ownerState.toUpperCase())){signals.push({text:`Out-of-state (${p.ownerState})`,type:'positive'});score+=20}
        else if(p.mailDiffers||oa){signals.push({text:'Absentee owner',type:'positive'});score+=12}}
    const eRx=/\bLLC\b|\bTRUST\b|\bLTD\b|\bPARTNERSHIP\b|\bINC\b|\bCORP\b|\bESTATE\b|\bFOUNDATION\b|\bGROUP\b/i;
    if(p.ownerName&&eRx.test(p.ownerName)){if(/TRUST|ESTATE/i.test(p.ownerName)){signals.push({text:'Trust/Estate',type:'positive'});score+=15}else{signals.push({text:'Entity (LLC/Corp)',type:'positive'});score+=10}}
    if(p.totalValue>0&&p.landValue>0&&p.landValue/p.totalValue>0.65){signals.push({text:'Land > building value',type:'positive'});score+=8}
    const v=all.filter(x=>x.totalValue>0&&!x.exempt);if(v.length>=5&&p.totalValue>0){const vs=v.map(x=>x.totalValue).sort((a,b)=>a-b);const med=vs[Math.floor(vs.length/2)];if(p.totalValue<med*0.55){signals.push({text:'Below area median',type:'positive'});score+=8}}
    score=Math.min(95,Math.max(5,score));return{score,scoreClass:score>=65?'high':score>=40?'medium':'low',signals}}

function latlngToMerc(lat,lng){const x=lng*20037508.34/180;const y=Math.log(Math.tan((90+lat)*Math.PI/360))/(Math.PI/180)*20037508.34/180;return{x,y}}

async function loadParcels(){
    if(isLoading)return;const zoom=map.getZoom();
    if(zoom<MIN_ZOOM){document.getElementById('zoomMessage').style.display='block';document.getElementById('statsBar').style.display='none';return}
    document.getElementById('zoomMessage').style.display='none';
    const c=map.getCenter();const match=getSource(c.lat,c.lng);
    if(!match){document.getElementById('stateBadge').textContent='COVERAGE COMING SOON';document.getElementById('stateBadge').style.color='#f87171';return}
    const{source}=match;document.getElementById('stateBadge').textContent=source.name.toUpperCase();document.getElementById('stateBadge').style.color='#c4a87c';
    isLoading=true;document.getElementById('loadingText').textContent=`Loading ${source.name} parcels...`;document.getElementById('mapLoading').classList.add('active');
    try{const b=map.getBounds();const sw=latlngToMerc(b.getSouth(),b.getWest());const ne=latlngToMerc(b.getNorth(),b.getEast());
    const params=new URLSearchParams({geometry:`${sw.x},${sw.y},${ne.x},${ne.y}`,geometryType:'esriGeometryEnvelope',inSR:'3857',spatialRel:'esriSpatialRelIntersects',outFields:source.fields,returnGeometry:'true',returnCentroid:'true',outSR:'4326',f:'json',resultRecordCount:String(source.max)});
    const res=await fetch(`${source.url}?${params}`);const data=await res.json();
    if(data.features?.length>0){const parcels=data.features.map(f=>source.parse(f)).filter(p=>p.lat!==0&&!p.exempt&&(p.ownerName||p.address));
    const scored=parcels.map(p=>{const{score,scoreClass,signals}=scoreParcel(p,parcels);return{...p,score,scoreClass,signals}});addMarkers(scored);updateStats()}}
    catch(e){console.error(e)}finally{isLoading=false;document.getElementById('mapLoading').classList.remove('active')}}

function addMarkers(parcels){for(const p of parcels){if(p.score===0)continue;
if(markers.some(m=>{const pos=m.getLatLng();return Math.abs(pos.lat-p.lat)<0.00001&&Math.abs(pos.lng-p.lng)<0.00001}))continue;
const icon=L.divIcon({className:'',html:`<div style="width:14px;height:14px;background:${colors[p.scoreClass]};border-radius:50%;border:2px solid rgba(0,0,0,0.4);box-shadow:0 0 8px ${glows[p.scoreClass]},0 2px 4px rgba(0,0,0,0.3);transition:transform 0.15s" onmouseover="this.style.transform='scale(1.5)'" onmouseout="this.style.transform='scale(1)'"></div>`,iconSize:[14,14],iconAnchor:[7,7]});
const marker=L.marker([p.lat,p.lng],{icon}).addTo(map);marker._pd=p;
marker.bindPopup(()=>popup(p),{maxWidth:340,minWidth:320,closeButton:true,autoPan:true,autoPanPaddingTopLeft:[10,80]});markers.push(marker)}}

    return `<div class="popup-card" style="padding:0">

        ${p.signals.length>0?`<div class="popup-signals">${sigs}</div>`:'<div style="font-size:11px;color:var(--text-tertiary);margin-bottom:14px">No strong sell signals from parcel data</div>'}

const API_BASE = 'https://sellersignal.co'; // Change to your Railway URL
let useRealAPI = true; // Set false to force demo mode

async function runDeep(address,csz,score,scoreClass,totalVal,bldgVal,landVal,ownerName,propType,subdivision){
    const overlay=document.getElementById('deepOverlay');
    const body=document.getElementById('deepBody');
    overlay.classList.add('active');
    
    const fullAddr=address+(csz?', '+csz:'');
    body.innerHTML=`<div class="deep-loading"><div class="deep-spinner"></div><p>Running Deep Signal on ${address}...</p><div class="substep" id="ds-step">Connecting to research engine...</div></div>`;
    
    const steps=['Searching Zillow, Redfin, county records in parallel...','Pulling LinkedIn, public records, business filings...','Scanning for life events, relocation signals, social media...','Analyzing findings and building approach strategy...'];
    let si=0;
    const stepInterval=setInterval(()=>{si++;if(si<steps.length){const el=document.getElementById('ds-step');if(el)el.textContent=steps[si]}},4000);

    let result = null;
    
    if (useRealAPI) {
        try {
            const res = await fetch(`${API_BASE}/api/beta-research`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    ownerName: ownerName || '',
                    propertyAddress: fullAddr,
                    preliminaryScore: score
                })
            });
            if (res.ok) {
                result = await res.json();
            } else {
                const err = await res.json();
                console.log('API error:', err.error);
            }
        } catch(e) {
            console.log('API unreachable, using demo mode:', e.message);
        }
    }

    clearInterval(stepInterval);

    if (result) {
        renderRealDeepSignal(result, fullAddr, scoreClass);
    } else {
        renderDemoDeepSignal(address, csz, score, scoreClass, totalVal, bldgVal, landVal, ownerName, propType, subdivision);
    }
}

function switchScript(tab,btn){
    document.querySelectorAll('.deep-script-tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.deep-script-content').forEach(c=>c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('ds-'+tab).classList.add('active');
}

// Initial load
loadParcels();
</script>

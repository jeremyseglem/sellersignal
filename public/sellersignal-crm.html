<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SellerSignal — My Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b10;--bg-card:#0e1419;--bg-hover:#141c24;--bg-elevated:#111921;--text:#f0ede8;--text-secondary:#7e8d9c;--text-dim:#4a5768;--gold:#c4a87c;--gold-dim:rgba(196,168,124,0.12);--gold-border:rgba(196,168,124,0.25);--green:#4ade80;--green-dim:rgba(74,222,128,0.1);--green-border:rgba(74,222,128,0.2);--yellow:#fbbf24;--yellow-dim:rgba(251,191,36,0.1);--red:#f87171;--red-dim:rgba(248,113,113,0.08);--blue:#60a5fa;--blue-dim:rgba(96,165,250,0.08);--border:#172030;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
::selection{background:var(--gold);color:var(--bg)}

.header{padding:16px 32px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(7,11,16,0.92);backdrop-filter:blur(20px);z-index:100}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.logo-mark{width:28px;height:28px;border:2px solid var(--text);border-radius:50%;display:flex;align-items:flex-end;justify-content:center;gap:2px;padding-bottom:6px}
.logo-mark .bar{width:2.5px;background:var(--text);border-radius:1px}
.logo-mark .bar:nth-child(1){height:4px}.logo-mark .bar:nth-child(2){height:7px}.logo-mark .bar:nth-child(3){height:11px}
.logo-text{font-family:'DM Serif Display',serif;font-size:18px}
.header-nav{display:flex;gap:8px}
.nav-btn{padding:7px 16px;border-radius:6px;font-size:12px;font-weight:500;color:var(--text-secondary);text-decoration:none;border:1px solid var(--border);transition:all 0.2s}
.nav-btn:hover{color:var(--text);border-color:var(--gold)}
.nav-btn.active{background:var(--gold-dim);border-color:var(--gold-border);color:var(--gold)}

.page{max-width:960px;margin:0 auto;padding:28px 24px 80px}

/* Pipeline value bar */
.pipeline{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:28px}
.pv-card{padding:16px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);text-align:center}
.pv-card .num{font-size:22px;font-weight:700}
.pv-card .lbl{font-size:9px;color:var(--text-dim);letter-spacing:0.06em;margin-top:4px}
.pv-card .bar{height:3px;border-radius:2px;margin-top:8px}

/* Status tabs */
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:7px 16px;background:transparent;border:1px solid var(--border);border-radius:20px;color:var(--text-dim);font-size:12px;font-weight:500;cursor:pointer;font-family:'Outfit',sans-serif;transition:all 0.2s}
.tab:hover{border-color:var(--border);color:var(--text-secondary)}
.tab.active{background:var(--gold-dim);border-color:var(--gold-border);color:var(--gold)}
.tab .cnt{font-weight:700;margin-left:4px}

/* Controls */
.controls{display:flex;gap:8px;margin-bottom:20px;align-items:center}
.controls input{flex:1;padding:10px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;font-family:'Outfit',sans-serif;outline:none}
.controls input:focus{border-color:var(--gold)}
.controls input::placeholder{color:var(--text-dim)}
.controls select{padding:10px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;font-family:'Outfit',sans-serif;outline:none;cursor:pointer}

/* Prospect cards */
.lead{display:flex;align-items:center;gap:16px;padding:16px 18px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;transition:all 0.15s;cursor:pointer}
.lead:hover{border-color:var(--border);background:var(--bg-hover)}
.lead-score{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.lead-score.high{background:var(--green-dim);border:2px solid var(--green-border);color:var(--green)}
.lead-score.med{background:var(--gold-dim);border:2px solid var(--gold-border);color:var(--gold)}
.lead-score.low{background:rgba(255,255,255,0.04);border:2px solid var(--border);color:var(--text-dim)}
.lead-info{flex:1;min-width:0}
.lead-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead-addr{font-size:12px;color:var(--text-dim);margin-top:2px}
.lead-chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip{padding:3px 8px;border-radius:4px;font-size:10px;font-weight:500;border:1px solid var(--border);color:var(--text-dim)}
.lead-right{text-align:right;flex-shrink:0}
.lead-val{font-weight:600;font-size:14px;color:var(--gold)}
.lead-comm{font-size:10px;color:var(--text-dim);margin-top:2px}
.lead-status{margin-top:6px}
.lead-status select{padding:4px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;font-size:10px;color:var(--text-secondary);font-family:'Outfit',sans-serif;cursor:pointer}

.empty{text-align:center;padding:60px 20px;color:var(--text-dim)}
.empty .icon{font-size:40px;margin-bottom:12px}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:768px){
.pipeline{grid-template-columns:repeat(3,1fr)}.controls{flex-wrap:wrap}.header{padding:12px 16px}.page{padding:16px 12px 60px}
}
</style>
</head>
<body>
<header class="header">
    <a href="/" class="logo">
        <div class="logo-mark"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        <span class="logo-text">SellerSignal</span>
    </a>
    <div class="header-nav">
        <a href="/sellersignal-briefing.html" class="nav-btn">Briefing</a>
        <a href="/sellersignal-crm.html" class="nav-btn active">Pipeline</a>
        <a href="/territories.html" class="nav-btn">Territories</a>
    </div>
</header>
<div class="page">
    <div style="margin-bottom:24px">
        <div style="font-family:'DM Serif Display',serif;font-size:28px;margin-bottom:4px">My Pipeline</div>
        <div style="font-size:13px;color:var(--text-secondary)">Every lead you've seen, scored, and contacted.</div>
    </div>
    <div class="pipeline" id="pipelineBar"></div>
    <div class="tabs" id="statusTabs"></div>
    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search name or address..." oninput="renderLeads()">
        <select id="sortSelect" onchange="renderLeads()">
            <option value="score">Score ↓</option>
            <option value="value">Value ↓</option>
            <option value="recent">Recently Updated</option>
            <option value="name">Name A-Z</option>
        </select>
        <select id="ownerTypeFilter" onchange="renderLeads()">
            <option value="">All Types</option>
        </select>
    </div>
    <div id="leadList"></div>
</div>
<script>
const STATUSES = {
    all: { label:'All', color:'var(--text)' },
    hot: { label:'🔥 Hot', color:'var(--gold)' },
    contacted: { label:'Contacted', color:'var(--blue)' },
    follow_up: { label:'Follow Up', color:'var(--yellow)' },
    won: { label:'🏆 Won', color:'var(--green)' },
    archived: { label:'Archived', color:'var(--text-dim)' },
};

// Map CRM status to tab
function statusToTab(s) {
    if (!s || s === 'new') return 'hot';
    if (s === 'contacted') return 'contacted';
    if (s === 'appointment' || s === 'follow_up') return 'follow_up';
    if (s === 'listed' || s === 'under_contract' || s === 'closed') return 'won';
    if (s === 'dead' || s === 'archived') return 'archived';
    return 'hot';
}

let leads = [];
let activeTab = 'all';
let saleDetections = {};

// Load from localStorage snapshots + CRM status
function loadLeads() {
    const snapshots = JSON.parse(localStorage.getItem('ss_snapshots') || '{}');
    const crmPipeline = JSON.parse(localStorage.getItem('ss_crm_pipeline') || '{}');
    const crmContacts = JSON.parse(localStorage.getItem('ss_crm_contacts') || '{}');
    
    leads = [];
    const seen = new Set();
    
    // Snapshots are stored as flat map: parcel_id → { ownerName, address, zip, briefingRank, ... }
    for (const [id, p] of Object.entries(snapshots)) {
        if (seen.has(id)) continue;
        if (!p || typeof p !== 'object') continue;
        if (!p.ownerName && !p.address) continue;
        seen.add(id);
        
        const crm = crmPipeline[id] || {};
        const contact = crmContacts[id] || {};
        
        leads.push({
            id,
            name: p.ownerName || p.owner_name || '',
            address: p.address || '',
            zip: p.zip || p.zipCode || p.zip_code || '',
            score: p.briefingRank || p.sellerLikelihood || 0,
            value: p.totalValue || p.assessed_value || 0,
            commission: Math.round((p.totalValue || p.assessed_value || 0) * 0.025),
            cohort: p.ownerType || p.cohortLabel || p.cohort || p.owner_type || '',
            propType: p.propType || p.prop_type || '',
            status: crm.status || contact.action || 'new',
            tab: statusToTab(crm.status || contact.action),
            updatedAt: crm.updatedAt || contact.timestamp || '',
            isAbsentee: p.isAbsentee || p.is_absentee,
            isOutOfState: p.isOutOfState || p.is_out_of_state,
            ownerState: p.ownerState || p.owner_state || '',
            sold: !!saleDetections[id],
            salePrice: crm.salePrice || saleDetections[id]?.sale_price || 0,
            actualCommission: crm.actualCommission || 0,
        });
    }
}

function renderPipeline() {
    const total = leads.length;
    const hot = leads.filter(l => l.tab === 'hot').length;
    const contacted = leads.filter(l => l.tab === 'contacted').length;
    const responded = leads.filter(l => l.status === 'appointment').length;
    const won = leads.filter(l => l.tab === 'won').length;
    const listings = leads.filter(l => l.status === 'listed' || l.status === 'under_contract' || l.status === 'closed').length;
    
    const totalValue = leads.filter(l=>l.value>0).reduce((s,l)=>s+l.value,0);
    const totalComm = Math.round(totalValue * 0.025);
    const wonValue = leads.filter(l=>l.tab==='won').reduce((s,l)=>s+(l.salePrice||l.value),0);
    const earnedComm = leads.filter(l=>l.actualCommission>0).reduce((s,l)=>s+l.actualCommission,0);
    const activeValue = leads.filter(l=>l.status==='listed'||l.status==='under_contract').reduce((s,l)=>s+(l.salePrice||l.value),0);
    const activeComm = Math.round(activeValue * 0.025);
    
    const fmt = n => n >= 1000000 ? '$'+(n/1000000).toFixed(1)+'M' : n >= 1000 ? '$'+Math.round(n/1000)+'K' : '$'+n.toLocaleString();
    
    document.getElementById('pipelineBar').innerHTML = `
        <div class="pv-card"><div class="num">${total}</div><div class="lbl">TOTAL</div><div class="bar" style="background:var(--text-dim)"></div></div>
        <div class="pv-card"><div class="num" style="color:var(--green)">${hot}</div><div class="lbl">HOT LEADS</div><div class="bar" style="background:var(--green)"></div></div>
        <div class="pv-card"><div class="num" style="color:var(--gold)">${contacted}</div><div class="lbl">CONTACTED</div><div class="bar" style="background:var(--gold)"></div></div>
        <div class="pv-card"><div class="num" style="color:var(--gold)">${fmt(totalComm)}</div><div class="lbl">POTENTIAL COMMISSION</div><div class="bar" style="background:var(--gold)"></div></div>
        <div class="pv-card"><div class="num" style="color:${activeComm>0?'var(--yellow)':'var(--text-dim)'}">${activeComm>0?fmt(activeComm):'$0'}</div><div class="lbl">PENDING CLOSE</div><div class="bar" style="background:var(--yellow)"></div></div>
        <div class="pv-card"><div class="num" style="color:${earnedComm>0?'var(--green)':'var(--text-dim)'}">${earnedComm>0?fmt(earnedComm):'$0'}</div><div class="lbl">EARNED COMMISSION</div><div class="bar" style="background:var(--green)"></div></div>
    `;
}

function renderTabs() {
    const counts = { all: leads.length };
    for (const l of leads) counts[l.tab] = (counts[l.tab] || 0) + 1;
    
    document.getElementById('statusTabs').innerHTML = Object.entries(STATUSES).map(([key, s]) => 
        `<div class="tab ${activeTab===key?'active':''}" onclick="activeTab='${key}';renderLeads()">${s.label}<span class="cnt">${counts[key]||0}</span></div>`
    ).join('');
}

function renderLeads() {
    const search = (document.getElementById('searchInput')?.value || '').toLowerCase();
    const sort = document.getElementById('sortSelect')?.value || 'score';
    const ownerType = document.getElementById('ownerTypeFilter')?.value || '';
    
    let filtered = leads.filter(l => {
        if (activeTab !== 'all' && l.tab !== activeTab) return false;
        if (search && !l.name.toLowerCase().includes(search) && !l.address.toLowerCase().includes(search)) return false;
        if (ownerType && l.cohort !== ownerType) return false;
        return true;
    });
    
    if (sort === 'score') filtered.sort((a,b) => b.score - a.score);
    else if (sort === 'value') filtered.sort((a,b) => b.value - a.value);
    else if (sort === 'recent') filtered.sort((a,b) => (b.updatedAt||'').localeCompare(a.updatedAt||''));
    else if (sort === 'name') filtered.sort((a,b) => a.name.localeCompare(b.name));
    
    if (!filtered.length) {
        document.getElementById('leadList').innerHTML = `<div class="empty"><div class="icon">📋</div>No leads${activeTab!=='all'?' in this category':''}.<br><span style="font-size:12px">Run a briefing to start building your pipeline.</span></div>`;
        return;
    }
    
    document.getElementById('leadList').innerHTML = filtered.slice(0, 100).map(l => {
        const scoreClass = l.score >= 55 ? 'high' : l.score >= 35 ? 'med' : 'low';
        const valStr = l.value >= 1000000 ? '$'+(l.value/1000000).toFixed(1)+'M' : l.value >= 1000 ? '$'+Math.round(l.value/1000)+'K' : l.value > 0 ? '$'+l.value.toLocaleString() : '';
        const commStr = l.commission > 0 ? '$'+l.commission.toLocaleString()+' est. commission' : '';
        const name = l.name.split(',').map(w=>w.trim().charAt(0).toUpperCase()+w.trim().slice(1).toLowerCase()).join(', ');
        
        return `<div class="lead" onclick="toggleDetail('${l.id}')">
            <div class="lead-score ${scoreClass}">${l.score}</div>
            <div class="lead-info">
                <div class="lead-name">${name}${l.sold ? ' <span style="color:var(--green);font-size:10px;font-weight:700">✓ SOLD</span>' : ''}</div>
                <div class="lead-addr">${l.address}${l.zip ? ' · '+l.zip : ''}</div>
                <div class="lead-chips">
                    ${l.cohort ? `<span class="chip">${l.cohort}</span>` : ''}
                    ${l.isOutOfState ? `<span class="chip" style="color:var(--gold)">Out-of-State (${l.ownerState})</span>` : ''}
                    ${l.isAbsentee ? `<span class="chip">Absentee</span>` : ''}
                    ${l.propType ? `<span class="chip">${l.propType}</span>` : ''}
                </div>
            </div>
            <div class="lead-right">
                ${l.actualCommission > 0 ? `
                    <div class="lead-val" style="color:var(--green)">$${l.actualCommission.toLocaleString()}</div>
                    <div class="lead-comm" style="color:var(--green)">earned commission</div>
                ` : l.salePrice > 0 && (l.status==='listed'||l.status==='under_contract') ? `
                    <div class="lead-val">$${l.salePrice >= 1000000 ? (l.salePrice/1000000).toFixed(1)+'M' : Math.round(l.salePrice/1000)+'K'}</div>
                    <div class="lead-comm">list price · $${Math.round(l.salePrice*0.025).toLocaleString()} est.</div>
                ` : valStr ? `
                    <div class="lead-val">${valStr}</div>
                    <div class="lead-comm">${commStr}</div>
                ` : ''}
                <div class="lead-status">
                    <select onclick="event.stopPropagation()" onchange="event.stopPropagation();updateStatus('${l.id}',this.value)">
                        <option value="new" ${l.status==='new'?'selected':''}>New</option>
                        <option value="contacted" ${l.status==='contacted'?'selected':''}>Contacted</option>
                        <option value="appointment" ${l.status==='appointment'?'selected':''}>Appointment</option>
                        <option value="listed" ${l.status==='listed'?'selected':''}>Listed</option>
                        <option value="under_contract" ${l.status==='under_contract'?'selected':''}>Under Contract</option>
                        <option value="closed" ${l.status==='closed'?'selected':''}>Closed</option>
                        <option value="dead" ${l.status==='dead'?'selected':''}>Dead / Archive</option>
                    </select>
                </div>
            </div>
        </div>`;
    }).join('') + (filtered.length > 100 ? `<div style="text-align:center;padding:16px;color:var(--text-dim);font-size:12px">Showing 100 of ${filtered.length} leads</div>` : '');
    
    renderTabs();
}

function updateStatus(id, status) {
    const pipeline = JSON.parse(localStorage.getItem('ss_crm_pipeline') || '{}');
    const lead = leads.find(l => l.id === id);
    
    let actualCommission = pipeline[id]?.actualCommission || 0;
    let salePrice = pipeline[id]?.salePrice || 0;
    
    // Prompt for actual numbers when marking as closed
    if (status === 'closed') {
        const sp = prompt('Sale price? (e.g. 2400000)', lead?.value || '');
        if (sp === null) return; // cancelled
        salePrice = parseInt(sp.replace(/[^0-9]/g, '')) || 0;
        
        const defaultComm = Math.round(salePrice * 0.025);
        const ac = prompt('Your commission? (e.g. ' + defaultComm + ')', defaultComm);
        if (ac === null) return;
        actualCommission = parseInt(ac.replace(/[^0-9]/g, '')) || 0;
    }
    
    // Prompt for sale price when marking as listed or under contract
    if ((status === 'listed' || status === 'under_contract') && !salePrice) {
        const sp = prompt('List price? (e.g. 2400000)', lead?.value || '');
        if (sp && sp !== 'null') {
            salePrice = parseInt(sp.replace(/[^0-9]/g, '')) || 0;
        }
    }
    
    pipeline[id] = {
        ...pipeline[id],
        status,
        updatedAt: new Date().toISOString(),
        ownerName: lead?.name || '',
        address: lead?.address || '',
        value: lead?.value || 0,
        commission: lead?.commission || 0,
        salePrice: salePrice || pipeline[id]?.salePrice || 0,
        actualCommission: actualCommission || pipeline[id]?.actualCommission || 0,
    };
    localStorage.setItem('ss_crm_pipeline', JSON.stringify(pipeline));
    
    // Update in-memory
    if (lead) {
        lead.status = status;
        lead.tab = statusToTab(status);
        lead.salePrice = salePrice || lead.salePrice;
        lead.actualCommission = actualCommission || lead.actualCommission;
    }
    renderPipeline();
    renderLeads();
}

function toggleDetail(id) {
    // Future: expand card with full Deep Signal, mail history, notes
}

// Populate owner type filter
function populateFilters() {
    const types = {};
    for (const l of leads) if (l.cohort) types[l.cohort] = (types[l.cohort]||0) + 1;
    const sel = document.getElementById('ownerTypeFilter');
    sel.innerHTML = '<option value="">All Types</option>' + 
        Object.entries(types).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<option value="${k}">${k} (${v})</option>`).join('');
}

// Fetch sale detections
async function loadSaleDetections() {
    try {
        const r = await fetch('/api/sale-detections');
        const d = await r.json();
        for (const det of (d.detections || [])) {
            saleDetections[det.parcel_id] = det;
        }
    } catch(e) {}
}

// Init
async function init() {
    await loadSaleDetections();
    loadLeads();
    populateFilters();
    renderPipeline();
    renderTabs();
    renderLeads();
}

init();
</script>
</body>
</html>
